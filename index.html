<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ============================================================================
    // MOTOR DE BASE DE DATOS LOCAL NATIVA (IndexedDB + Respaldo LocalStorage)
    // ============================================================================
    const DB_NAME = 'AgendaIntegralJavierDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'estado_agenda';

    const abrirBaseDatosLocal = () => {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        const request = window.indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
      });
    };

    const guardarEnBDLocal = async (clave, valor) => {
      try {
        localStorage.setItem(clave, JSON.stringify(valor));
      } catch (e) {}
      try {
        const db = await abrirBaseDatosLocal();
        if (!db) return;
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(valor, clave);
      } catch (e) {}
    };

    const leerDeBDLocal = async (clave, valorPorDefecto) => {
      try {
        const db = await abrirBaseDatosLocal();
        if (db) {
          const resultado = await new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(clave);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(undefined);
          });
          if (resultado !== undefined) return resultado;
        }
      } catch (e) {}
      try {
        const local = localStorage.getItem(clave);
        return local ? JSON.parse(local) : valorPorDefecto;
      } catch {
        return valorPorDefecto;
      }
    };

    // Codificación UTF-8 segura en Base64 para API de GitHub y Enlaces QR
    const utf8ToBase64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
    const base64ToUtf8 = (b64) => decodeURIComponent(escape(window.atob(b64.replace(/\s/g, ''))));

    // Autodetectar usuario y repositorio si se ejecuta desde GitHub Pages
    const detectarRepoGitHubPages = () => {
      const host = window.location.hostname;
      const path = window.location.pathname.split('/').filter(Boolean);
      if (host.endsWith('.github.io')) {
        const owner = host.split('.')[0];
        const repo = path[0] || '';
        return { owner, repo };
      }
      return { owner: '', repo: '' };
    };

    // Componente de Íconos Lucide
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: spanRef.current });
        }
      }, [name, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    // Configuración de los 3 Ámbitos
    const AMBITOS = {
      'Arte y Video': {
        id: 'Arte y Video',
        nombre: 'Arte y Video',
        descripcion: 'Estudio fotográfico, producción de video, edición e impresiones',
        icon: 'camera',
        bgLight: 'bg-amber-50 dark:bg-amber-950/30',
        borderLight: 'border-amber-200 dark:border-amber-800/60',
        textClass: 'text-amber-700 dark:text-amber-300',
        badgeClass: 'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-200 border-amber-300 dark:border-amber-700',
        btnClass: 'bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold',
        dotClass: 'bg-amber-500',
        subcategorias: [
          'Sesión Fotográfica',
          'Edición de Video / Foto',
          'Impresión Fine Art / Lona',
          'Cobertura de Evento',
          'Atención a Clientes',
          'Mantenimiento de Equipo'
        ]
      },
      'Preparatoria Lázaro Cárdenas': {
        id: 'Preparatoria Lázaro Cárdenas',
        nombre: 'Preparatoria Lázaro Cárdenas',
        descripcion: 'Docencia, Taller de Medios, Radio 95.1 FM y proyectos educativos',
        icon: 'graduation-cap',
        bgLight: 'bg-indigo-50 dark:bg-indigo-950/30',
        borderLight: 'border-indigo-200 dark:border-indigo-800/60',
        textClass: 'text-indigo-700 dark:text-indigo-300',
        badgeClass: 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900/60 dark:text-indigo-200 border-indigo-300 dark:border-indigo-700',
        btnClass: 'bg-indigo-600 hover:bg-indigo-700 text-white font-bold',
        dotClass: 'bg-indigo-500',
        subcategorias: [
          'Clase Frente a Grupo',
          'Taller de Medios',
          'Radio Escolar 95.1 FM',
          'Proyecto Educativo / Concurso',
          'Revisión y Calificaciones',
          'Reunión Académica'
        ]
      },
      'Personal': {
        id: 'Personal',
        nombre: 'Personal',
        descripcion: 'Familia, salud, hogar, trámites y descanso',
        icon: 'user',
        bgLight: 'bg-emerald-50 dark:bg-emerald-950/30',
        borderLight: 'border-emerald-200 dark:border-emerald-800/60',
        textClass: 'text-emerald-700 dark:text-emerald-300',
        badgeClass: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-200 border-emerald-300 dark:border-emerald-700',
        btnClass: 'bg-emerald-600 hover:bg-emerald-700 text-white font-bold',
        dotClass: 'bg-emerald-500',
        subcategorias: [
          'Familia y Hogar',
          'Salud y Ejercicio',
          'Trámites y Finanzas',
          'Desarrollo Personal',
          'Descanso / Ocio',
          'Compras'
        ]
      }
    };

    const PRIORIDADES = {
      'Alta': { label: 'Alta', color: 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/50 border-rose-200 dark:border-rose-800' },
      'Media': { label: 'Media', color: 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/50 border-amber-200 dark:border-amber-800' },
      'Baja': { label: 'Baja', color: 'text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700' }
    };

    const VOCABULARIO_INICIAL = [
      { id: 'voc-1', termino: 'Cananea', variantes: 'cananea, kananea, cana nea', categoria: 'General' },
      { id: 'voc-2', termino: 'Fuerza Puma', variantes: 'fuerza puma, fuersa puma, pumas prepa', categoria: 'Preparatoria Lázaro Cárdenas' },
      { id: 'voc-3', termino: '95.1 FM', variantes: '95.1, noventa y cinco punto uno, 95 1 fm, radio 95.1', categoria: 'Preparatoria Lázaro Cárdenas' },
      { id: 'voc-4', termino: 'Taller de Medios', variantes: 'taller de medios, taller medios', categoria: 'Preparatoria Lázaro Cárdenas' },
      { id: 'voc-5', termino: 'Fine Art', variantes: 'fine art, fain art, impresión fine art', categoria: 'Arte y Video' },
      { id: 'voc-6', termino: 'Vértice', variantes: 'vertice, vértice, concurso vértice', categoria: 'Preparatoria Lázaro Cárdenas' },
      { id: 'voc-7', termino: 'Lázaro Cárdenas', variantes: 'lazaro cardenas, lázaro cárdenas, prepa lazaro', categoria: 'Preparatoria Lázaro Cárdenas' }
    ];

    const EJEMPLOS_DICTADO = [
      'Agendar mañana a las 4 de la tarde sesión fotográfica en Arte y Video con prioridad alta',
      'El lunes a las 10 am junta de Radio Escolar 95.1 FM Fuerza Puma en la Preparatoria Lázaro Cárdenas',
      'Pasado mañana a las 6 de la tarde impresión Fine Art para exposición Vértice en Cananea',
      'Hoy a las 8 de la noche cena familiar y descanso en ámbito Personal con prioridad media'
    ];

    const formatDateISO = (dateObj) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const addDays = (dateObj, days) => {
      const result = new Date(dateObj);
      result.setDate(result.getDate() + days);
      return result;
    };

    const generarCompromisosIniciales = () => {
      const hoy = new Date();
      const manana = addDays(hoy, 1);
      return [
        {
          id: 'demo-1',
          titulo: 'Sesión de Retrato en Estudio y Selección',
          ambito: 'Arte y Video',
          subcategoria: 'Sesión Fotográfica',
          fecha: formatDateISO(hoy),
          horaInicio: '10:00',
          horaFin: '12:00',
          prioridad: 'Alta',
          notas: 'Preparar esquema de iluminación con softbox y revisar equipo.',
          completado: false,
          actualizadoEn: Date.now()
        },
        {
          id: 'demo-2',
          titulo: 'Producción de Cápsulas en Radio 95.1 FM Fuerza Puma',
          ambito: 'Preparatoria Lázaro Cárdenas',
          subcategoria: 'Radio Escolar 95.1 FM',
          fecha: formatDateISO(hoy),
          horaInicio: '13:30',
          horaFin: '15:00',
          prioridad: 'Alta',
          notas: 'Grabar cortinillas con alumnos del Taller de Medios.',
          completado: false,
          actualizadoEn: Date.now()
        },
        {
          id: 'demo-3',
          titulo: 'Recepción de cuadros 6x8 Concurso Vértice Tierra y Cobre',
          ambito: 'Preparatoria Lázaro Cárdenas',
          subcategoria: 'Proyecto Educativo / Concurso',
          fecha: formatDateISO(manana),
          horaInicio: '16:00',
          horaFin: '17:30',
          prioridad: 'Alta',
          notas: 'Verificar entregas digitales y marcos físicos en Cananea.',
          completado: false,
          actualizadoEn: Date.now()
        }
      ];
    };

    function App() {
      // Tema Oscuro / Claro
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('agenda_javier_dark_v3');
        return saved !== null ? JSON.parse(saved) : true;
      });

      useEffect(() => {
        localStorage.setItem('agenda_javier_dark_v3', JSON.stringify(darkMode));
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      // Navegación
      const [vistaActiva, setVistaActiva] = useState('dashboard');
      const [modoCalendario, setModoCalendario] = useState('mes');

      // Estado de Datos Principales (Cargados desde IndexedDB + LocalStorage)
      const [compromisos, setCompromisos] = useState([]);
      const [vocabulario, setVocabulario] = useState(VOCABULARIO_INICIAL);
      const [bdLista, setBdLista] = useState(false);
      const [ultimaModificacionLocal, setUltimaModificacionLocal] = useState(() => {
        return Number(localStorage.getItem('agenda_javier_last_mod_v3') || 0);
      });

      // Configuración de Sincronización Sin Firebase (GitHub Repo API o Google Apps Script)
      const detectado = useMemo(() => detectarRepoGitHubPages(), []);
      const [syncConfig, setSyncConfig] = useState(() => {
        try {
          const guardado = localStorage.getItem('agenda_javier_sync_cfg_v3');
          if (guardado) return JSON.parse(guardado);
        } catch {}
        return {
          metodo: 'github', // 'github' | 'google'
          ghOwner: detectado.owner || '',
          ghRepo: detectado.repo || '',
          ghBranch: 'main',
          ghToken: '',
          googleScriptUrl: '',
          autoSync: true
        };
      });

      const [estadoSync, setEstadoSync] = useState('local'); // 'local' | 'sincronizando' | 'conectado' | 'error'
      const [mensajeSync, setMensajeSync] = useState('Guardado en Base de Datos Local (IndexedDB)');
      const [ultimaHoraSync, setUltimaHoraSync] = useState('');
      const [modalSyncAbierto, setModalSyncAbierto] = useState(false);
      const [tabModalSync, setTabModalSync] = useState('github'); // 'github' | 'qr' | 'google' | 'archivo'

      // Filtros y Búsqueda
      const [filtroAmbito, setFiltroAmbito] = useState('Todos');
      const [filtroEstado, setFiltroEstado] = useState('Todos');
      const [busqueda, setBusqueda] = useState('');

      // Calendario
      const [fechaCursor, setFechaCursor] = useState(new Date());
      const [diaSeleccionado, setDiaSeleccionado] = useState(formatDateISO(new Date()));

      // Modales de Compromisos y Voz
      const [modalAbierto, setModalAbierto] = useState(false);
      const [compromisoEditando, setCompromisoEditando] = useState(null);
      const [notificacion, setNotificacion] = useState(null);

      const [modalVozAbierto, setModalVozAbierto] = useState(false);
      const [tabModalVoz, setTabModalVoz] = useState('dictar');
      const [escuchandoVoz, setEscuchandoVoz] = useState(false);
      const [campoDictadoActivo, setCampoDictadoActivo] = useState(null);
      const [textoDictado, setTextoDictado] = useState('');
      const [propuestaVoz, setPropuestaVoz] = useState(null);
      const recognitionRef = useRef(null);
      const [nuevoTermino, setNuevoTermino] = useState({ termino: '', variantes: '', categoria: 'Arte y Video' });

      const [formData, setFormData] = useState({
        titulo: '',
        ambito: 'Arte y Video',
        subcategoria: 'Sesión Fotográfica',
        fecha: formatDateISO(new Date()),
        horaInicio: '09:00',
        horaFin: '10:30',
        prioridad: 'Media',
        notas: '',
        completado: false
      });

      const mostrarMensaje = (texto, tipo = 'exito') => {
        setNotificacion({ texto, tipo });
        setTimeout(() => setNotificacion(null), 3400);
      };

      // 1. Cargar Base de Datos Local (IndexedDB) al iniciar y revisar si viene un enlace QR de emparejamiento
      useEffect(() => {
        const inicializar = async () => {
          const compGuardados = await leerDeBDLocal('agenda_javier_compromisos_v3', null);
          const vocabGuardado = await leerDeBDLocal('agenda_javier_vocab_v3', null);

          if (compGuardados && Array.isArray(compGuardados)) {
            setCompromisos(compGuardados);
          } else {
            const iniciales = generarCompromisosIniciales();
            setCompromisos(iniciales);
            await guardarEnBDLocal('agenda_javier_compromisos_v3', iniciales);
          }

          if (vocabGuardado && Array.isArray(vocabGuardado)) {
            setVocabulario(vocabGuardado);
          } else {
            setVocabulario(VOCABULARIO_INICIAL);
            await guardarEnBDLocal('agenda_javier_vocab_v3', VOCABULARIO_INICIAL);
          }

          // Revisar si la URL trae configuración de emparejamiento por QR (#pair=...)
          if (window.location.hash.startsWith('#pair=')) {
            try {
              const b64 = window.location.hash.replace('#pair=', '');
              const decodificado = JSON.parse(base64ToUtf8(b64));
              if (decodificado.syncConfig) {
                setSyncConfig(decodificado.syncConfig);
                localStorage.setItem('agenda_javier_sync_cfg_v3', JSON.stringify(decodificado.syncConfig));
                mostrarMensaje('Dispositivo vinculado por QR correctamente');
              }
              if (Array.isArray(decodificado.compromisos)) {
                setCompromisos(decodificado.compromisos);
                await guardarEnBDLocal('agenda_javier_compromisos_v3', decodificado.compromisos);
              }
              window.history.replaceState(null, '', window.location.pathname);
            } catch (e) {}
          }

          setBdLista(true);
        };
        inicializar();
      }, []);

      // 2. Guardar cada cambio automáticamente en IndexedDB + LocalStorage
      useEffect(() => {
        if (!bdLista) return;
        guardarEnBDLocal('agenda_javier_compromisos_v3', compromisos);
      }, [compromisos, bdLista]);

      useEffect(() => {
        if (!bdLista) return;
        guardarEnBDLocal('agenda_javier_vocab_v3', vocabulario);
      }, [vocabulario, bdLista]);

      // ============================================================================
      // MOTOR DE SINCRONIZACIÓN MULTI-DISPOSITIVO SIN FIREBASE (GitHub / Google)
      // ============================================================================
      const sincronizarConNubePropia = useCallback(async (modo = 'pull', datosCompromisos = compromisos, datosVocab = vocabulario) => {
        // MODO A: SINCRONIZACIÓN DIRECTA CON EL PROPIO REPOSITORIO DE GITHUB
        if (syncConfig.metodo === 'github') {
          const { ghOwner, ghRepo, ghBranch, ghToken } = syncConfig;
          if (!ghOwner || !ghRepo || !ghToken) {
            setEstadoSync('local');
            setMensajeSync('Guardado en Base de Datos Local (IndexedDB)');
            return;
          }

          setEstadoSync('sincronizando');
          const urlApi = `https://api.github.com/repos/${ghOwner.trim()}/${ghRepo.trim()}/contents/agenda-datos.json`;
          const headers = {
            'Authorization': `Bearer ${ghToken.trim()}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          };

          try {
            // Primero consultamos si ya existe agenda-datos.json en el repositorio
            const getRes = await fetch(`${urlApi}?ref=${ghBranch || 'main'}&_t=${Date.now()}`, { headers });
            let shaActual = null;
            let datosRemotos = null;

            if (getRes.ok) {
              const fileData = await getRes.json();
              shaActual = fileData.sha;
              if (fileData.content) {
                datosRemotos = JSON.parse(base64ToUtf8(fileData.content));
              }
            }

            if (modo === 'pull' && datosRemotos) {
              // Descargar desde GitHub si los datos remotos existen
              if (Array.isArray(datosRemotos.compromisos)) {
                setCompromisos(datosRemotos.compromisos);
                await guardarEnBDLocal('agenda_javier_compromisos_v3', datosRemotos.compromisos);
              }
              if (Array.isArray(datosRemotos.vocabulario)) {
                setVocabulario(datosRemotos.vocabulario);
                await guardarEnBDLocal('agenda_javier_vocab_v3', datosRemotos.vocabulario);
              }
              setEstadoSync('conectado');
              const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
              setUltimaHoraSync(hora);
              setMensajeSync(`Sincronizado con GitHub (${ghOwner}/${ghRepo}) a las ${hora}`);
              return;
            }

            // Si es 'push' o si el archivo aún no existía en GitHub, subimos la base de datos local
            const paquete = {
              actualizadoEn: Date.now(),
              compromisos: datosCompromisos,
              vocabulario: datosVocab
            };

            const bodyPayload = {
              message: `Sincronización automática Agenda Integral (${new Date().toLocaleString('es-MX')})`,
              content: utf8ToBase64(JSON.stringify(paquete, null, 2)),
              branch: ghBranch || 'main'
            };
            if (shaActual) bodyPayload.sha = shaActual;

            const putRes = await fetch(urlApi, {
              method: 'PUT',
              headers,
              body: JSON.stringify(bodyPayload)
            });

            if (putRes.ok) {
              setEstadoSync('conectado');
              const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
              setUltimaHoraSync(hora);
              setMensajeSync(`Guardado en GitHub (${ghOwner}/${ghRepo}) a las ${hora}`);
            } else {
              throw new Error('Verifica permisos del Token de GitHub (Contents: Read & Write)');
            }
          } catch (err) {
            setEstadoSync('error');
            setMensajeSync('Guardado localmente (No se pudo conectar con GitHub API)');
          }
        }

        // MODO B: SINCRONIZACIÓN CON GOOGLE SHEETS / DRIVE (APPS SCRIPT)
        if (syncConfig.metodo === 'google') {
          const url = (syncConfig.googleScriptUrl || '').trim();
          if (!url) {
            setEstadoSync('local');
            return;
          }
          setEstadoSync('sincronizando');
          try {
            if (modo === 'pull') {
              const res = await fetch(`${url}?action=read&_t=${Date.now()}`);
              const data = await res.json();
              if (Array.isArray(data.compromisos)) {
                setCompromisos(data.compromisos);
                await guardarEnBDLocal('agenda_javier_compromisos_v3', data.compromisos);
              }
              if (Array.isArray(data.vocabulario)) {
                setVocabulario(data.vocabulario);
                await guardarEnBDLocal('agenda_javier_vocab_v3', data.vocabulario);
              }
            } else {
              await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                  actualizadoEn: Date.now(),
                  compromisos: datosCompromisos,
                  vocabulario: datosVocab
                })
              });
            }
            setEstadoSync('conectado');
            const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
            setUltimaHoraSync(hora);
            setMensajeSync(`Sincronizado con Google Drive/Sheets a las ${hora}`);
          } catch (e) {
            setEstadoSync('error');
            setMensajeSync('Guardado localmente (Verifica URL de Google Apps Script)');
          }
        }
      }, [syncConfig, compromisos, vocabulario]);

      // Sincronizar automáticamente al abrir la app y al volver a la pestaña (en celular/iPad/PC)
      useEffect(() => {
        if (!bdLista) return;
        const tieneCredenciales =
          (syncConfig.metodo === 'github' && syncConfig.ghToken && syncConfig.ghOwner && syncConfig.ghRepo) ||
          (syncConfig.metodo === 'google' && syncConfig.googleScriptUrl);

        if (!tieneCredenciales) return;

        sincronizarConNubePropia('pull');

        const alEnfocarVentana = () => {
          if (syncConfig.autoSync) sincronizarConNubePropia('pull');
        };
        window.addEventListener('focus', alEnfocarVentana);
        return () => window.removeEventListener('focus', alEnfocarVentana);
      }, [bdLista, syncConfig.metodo, syncConfig.ghToken, syncConfig.googleScriptUrl]);

      // Función auxiliar para actualizar compromisos localmente y disparar push inmediato a los demás dispositivos
      const actualizarYPublicarCompromisos = (nuevosCompromisos, mensajeExito) => {
        setCompromisos(nuevosCompromisos);
        const ahora = Date.now();
        setUltimaModificacionLocal(ahora);
        localStorage.setItem('agenda_javier_last_mod_v3', String(ahora));
        guardarEnBDLocal('agenda_javier_compromisos_v3', nuevosCompromisos);
        if (mensajeExito) mostrarMensaje(mensajeExito);

        if (syncConfig.autoSync) {
          sincronizarConNubePropia('push', nuevosCompromisos, vocabulario);
        }
      };

      // ============================================================================
      // DICTADO DE VOZ PERSONALIZADO (es-MX) Y CORRECCIÓN FONÉTICA
      // ============================================================================
      const aplicarVocabularioPersonalizado = (textoOriginal) => {
        if (!textoOriginal) return '';
        let resultado = textoOriginal;
        vocabulario.forEach((item) => {
          const listaVariantes = (item.variantes || '')
            .split(',')
            .map((v) => v.trim())
            .filter(Boolean);
          const todas = Array.from(new Set([...listaVariantes, item.termino]));
          todas.forEach((variante) => {
            if (!variante) return;
            const escapado = variante.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`\\b${escapado}\\b`, 'gi');
            resultado = resultado.replace(regex, item.termino);
          });
        });
        return resultado;
      };

      const analizarTextoLocalmente = (textoBruto) => {
        const texto = aplicarVocabularioPersonalizado(textoBruto);
        const lower = texto.toLowerCase();
        const hoy = new Date();

        let ambito = 'Arte y Video';
        if (
          lower.includes('prepa') || lower.includes('lázaro cárdenas') || lower.includes('lazaro cardenas') ||
          lower.includes('radio') || lower.includes('95.1') || lower.includes('taller de medios') ||
          lower.includes('fuerza puma') || lower.includes('clase') || lower.includes('alumno') ||
          lower.includes('concurso') || lower.includes('vértice') || lower.includes('vertice')
        ) {
          ambito = 'Preparatoria Lázaro Cárdenas';
        } else if (
          lower.includes('personal') || lower.includes('familia') || lower.includes('médico') ||
          lower.includes('salud') || lower.includes('casa') || lower.includes('hogar') ||
          lower.includes('cena') || lower.includes('descanso') || lower.includes('trámite')
        ) {
          ambito = 'Personal';
        }

        let subcategoria = AMBITOS[ambito].subcategorias[0];
        if (ambito === 'Arte y Video') {
          if (lower.includes('edición') || lower.includes('editar') || lower.includes('lightroom')) subcategoria = 'Edición de Video / Foto';
          else if (lower.includes('fine art') || lower.includes('impresión') || lower.includes('lona') || lower.includes('ampliación')) subcategoria = 'Impresión Fine Art / Lona';
          else if (lower.includes('cliente') || lower.includes('cotización') || lower.includes('entrega')) subcategoria = 'Atención a Clientes';
          else subcategoria = 'Sesión Fotográfica';
        } else if (ambito === 'Preparatoria Lázaro Cárdenas') {
          if (lower.includes('95.1') || lower.includes('radio') || lower.includes('cabina')) subcategoria = 'Radio Escolar 95.1 FM';
          else if (lower.includes('taller de medios') || lower.includes('medios')) subcategoria = 'Taller de Medios';
          else if (lower.includes('proyecto') || lower.includes('concurso') || lower.includes('vértice') || lower.includes('fuerza puma')) subcategoria = 'Proyecto Educativo / Concurso';
          else if (lower.includes('califica') || lower.includes('revisión')) subcategoria = 'Revisión y Calificaciones';
          else if (lower.includes('junta') || lower.includes('reunión')) subcategoria = 'Reunión Académica';
          else subcategoria = 'Clase Frente a Grupo';
        } else {
          if (lower.includes('salud') || lower.includes('médico') || lower.includes('ejercicio')) subcategoria = 'Salud y Ejercicio';
          else if (lower.includes('trámite') || lower.includes('pago') || lower.includes('banco')) subcategoria = 'Trámites y Finanzas';
          else if (lower.includes('descanso') || lower.includes('ocio')) subcategoria = 'Descanso / Ocio';
          else subcategoria = 'Familia y Hogar';
        }

        let fechaObj = new Date(hoy);
        if (lower.includes('pasado mañana')) {
          fechaObj = addDays(hoy, 2);
        } else if (lower.includes('mañana') && !lower.includes('de la mañana')) {
          fechaObj = addDays(hoy, 1);
        } else {
          const diasNombres = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
          diasNombres.forEach((diaNombre, idx) => {
            if (lower.includes(`el ${diaNombre}`) || lower.startsWith(diaNombre)) {
              const actual = hoy.getDay();
              let diff = (idx - actual + 7) % 7;
              if (diff === 0) diff = 7;
              fechaObj = addDays(hoy, diff);
            }
          });
        }
        const fecha = formatDateISO(fechaObj);

        let horaInicio = '09:00';
        let horaFin = '10:30';
        const matchHora = lower.match(/a las (\d{1,2})(?::(\d{2}))?\s*(am|pm|de la tarde|de la noche|de la mañana)?/i);
        if (matchHora) {
          let h = parseInt(matchHora[1], 10);
          const m = matchHora[2] ? parseInt(matchHora[2], 10) : 0;
          const periodo = (matchHora[3] || '').toLowerCase();
          if ((periodo.includes('pm') || periodo.includes('tarde') || periodo.includes('noche')) && h < 12) {
            h += 12;
          } else if (periodo.includes('mañana') && h === 12) {
            h = 0;
          }
          horaInicio = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          const hFin = Math.min(23, h + 1);
          horaFin = `${String(hFin).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        let prioridad = 'Media';
        if (lower.includes('prioridad alta') || lower.includes('urgente') || lower.includes('importante')) {
          prioridad = 'Alta';
        } else if (lower.includes('prioridad baja') || lower.includes('sin prisa')) {
          prioridad = 'Baja';
        }

        let tituloLimpio = texto
          .replace(/^(agendar|programar|anotar|crear|guardar)\s+/i, '')
          .replace(/\b(hoy|mañana|pasado mañana|el lunes|el martes|el miércoles|el jueves|el viernes|el sábado|el domingo)\b/gi, '')
          .replace(/a las \d{1,2}(:\d{2})?\s*(am|pm|de la tarde|de la noche|de la mañana|horas|hrs)?/gi, '')
          .replace(/con prioridad (alta|media|baja)/gi, '')
          .replace(/en el ámbito (de )?(arte y video|preparatoria lázaro cárdenas|personal)/gi, '')
          .replace(/en (arte y video|la preparatoria lázaro cárdenas|preparatoria lázaro cárdenas|ámbito personal)/gi, '')
          .replace(/\s+/g, ' ')
          .trim();

        if (tituloLimpio.length > 0) {
          tituloLimpio = tituloLimpio.charAt(0).toUpperCase() + tituloLimpio.slice(1);
        } else {
          tituloLimpio = `${subcategoria} (${ambito})`;
        }

        return {
          titulo: tituloLimpio,
          ambito,
          subcategoria,
          fecha,
          horaInicio,
          horaFin,
          prioridad,
          notas: `Dictado por voz: "${texto}"`
        };
      };

      const procesarDictado = (textoEntrada) => {
        const base = textoEntrada !== undefined ? textoEntrada : textoDictado;
        if (!base.trim()) {
          mostrarMensaje('Dicta o escribe una frase primero', 'alerta');
          return;
        }
        const corregido = aplicarVocabularioPersonalizado(base);
        setTextoDictado(corregido);
        setPropuestaVoz(analizarTextoLocalmente(corregido));
      };

      const alternarReconocimientoVoz = (destino = 'inteligente') => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (escuchandoVoz && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
          setEscuchandoVoz(false);
          setCampoDictadoActivo(null);
          return;
        }

        if (!SpeechRecognition) {
          mostrarMensaje('Usa Chrome, Edge o Safari para activar el micrófono.', 'alerta');
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'es-MX';
          recognition.continuous = false;
          recognition.interimResults = true;

          recognition.onstart = () => {
            setEscuchandoVoz(true);
            setCampoDictadoActivo(destino);
          };

          recognition.onresult = (event) => {
            let transcripcion = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              transcripcion += event.results[i][0].transcript;
            }
            const corregido = aplicarVocabularioPersonalizado(transcripcion);

            if (destino === 'inteligente') {
              setTextoDictado(corregido);
              setPropuestaVoz(analizarTextoLocalmente(corregido));
            } else if (destino === 'titulo') {
              setFormData((prev) => ({ ...prev, titulo: corregido }));
            } else if (destino === 'notas') {
              setFormData((prev) => ({ ...prev, notas: prev.notas ? `${prev.notas} ${corregido}`.trim() : corregido }));
            }
          };

          recognition.onerror = () => {
            setEscuchandoVoz(false);
            setCampoDictadoActivo(null);
            mostrarMensaje('Permiso de micrófono pendiente o sin audio.', 'alerta');
          };

          recognition.onend = () => {
            setEscuchandoVoz(false);
            setCampoDictadoActivo(null);
          };

          recognitionRef.current = recognition;
          recognition.start();
        } catch (e) {
          setEscuchandoVoz(false);
          setCampoDictadoActivo(null);
        }
      };

      // ============================================================================
      // OPERACIONES CRUD DE LA AGENDA
      // ============================================================================
      const abrirModalNuevo = (ambitoPredefinido = null, fechaPredefinida = null) => {
        const ambitoElegido = ambitoPredefinido && AMBITOS[ambitoPredefinido] ? ambitoPredefinido : 'Arte y Video';
        setCompromisoEditando(null);
        setFormData({
          titulo: '',
          ambito: ambitoElegido,
          subcategoria: AMBITOS[ambitoElegido].subcategorias[0],
          fecha: fechaPredefinida || formatDateISO(new Date()),
          horaInicio: '09:00',
          horaFin: '10:30',
          prioridad: 'Media',
          notas: '',
          completado: false
        });
        setModalAbierto(true);
      };

      const abrirModalEditar = (item) => {
        setCompromisoEditando(item);
        setFormData({
          titulo: item.titulo || '',
          ambito: item.ambito || 'Arte y Video',
          subcategoria: item.subcategoria || AMBITOS[item.ambito || 'Arte y Video'].subcategorias[0],
          fecha: item.fecha || formatDateISO(new Date()),
          horaInicio: item.horaInicio || '09:00',
          horaFin: item.horaFin || '10:30',
          prioridad: item.prioridad || 'Media',
          notas: item.notas || '',
          completado: Boolean(item.completado)
        });
        setModalAbierto(true);
      };

      const guardarCompromiso = (e) => {
        if (e) e.preventDefault();
        if (!formData.titulo.trim()) {
          mostrarMensaje('Ingresa un título para el compromiso', 'alerta');
          return;
        }
        const id = compromisoEditando ? compromisoEditando.id : `comp-${Date.now()}`;
        const nuevoObjeto = {
          ...formData,
          titulo: formData.titulo.trim(),
          id,
          actualizadoEn: Date.now()
        };

        const nuevaLista = compromisoEditando
          ? compromisos.map((c) => (c.id === id ? nuevoObjeto : c))
          : [...compromisos, nuevoObjeto];

        setModalAbierto(false);
        actualizarYPublicarCompromisos(
          nuevaLista,
          compromisoEditando ? 'Compromiso actualizado' : 'Compromiso guardado y sincronizado'
        );
      };

      const confirmarPropuestaVoz = () => {
        if (!propuestaVoz || !propuestaVoz.titulo) return;
        const nuevo = {
          ...propuestaVoz,
          id: `comp-${Date.now()}`,
          completado: false,
          actualizadoEn: Date.now()
        };
        const nuevaLista = [...compromisos, nuevo];
        setPropuestaVoz(null);
        setTextoDictado('');
        setModalVozAbierto(false);
        actualizarYPublicarCompromisos(nuevaLista, 'Compromiso por voz agendado');
      };

      const alternarCompletado = (item) => {
        const actualizado = { ...item, completado: !item.completado, actualizadoEn: Date.now() };
        const nuevaLista = compromisos.map((c) => (c.id === item.id ? actualizado : c));
        actualizarYPublicarCompromisos(
          nuevaLista,
          actualizado.completado ? 'Marcado como completado' : 'Marcado como pendiente'
        );
      };

      const eliminarCompromiso = (id) => {
        const nuevaLista = compromisos.filter((c) => c.id !== id);
        actualizarYPublicarCompromisos(nuevaLista, 'Compromiso eliminado');
      };

      // Cálculos y Estadísticas
      const hoyISO = formatDateISO(new Date());

      const compromisosOrdenados = useMemo(() => {
        return [...compromisos].sort((a, b) => {
          if (a.fecha !== b.fecha) return a.fecha.localeCompare(b.fecha);
          return (a.horaInicio || '00:00').localeCompare(b.horaInicio || '00:00');
        });
      }, [compromisos]);

      const compromisosFiltrados = useMemo(() => {
        return compromisosOrdenados.filter((item) => {
          const coincideAmbito = filtroAmbito === 'Todos' || item.ambito === filtroAmbito;
          const coincideEstado =
            filtroEstado === 'Todos' ||
            (filtroEstado === 'Pendientes' && !item.completado) ||
            (filtroEstado === 'Completados' && item.completado);
          const q = busqueda.toLowerCase().trim();
          const coincideBusqueda =
            !q ||
            item.titulo?.toLowerCase().includes(q) ||
            item.subcategoria?.toLowerCase().includes(q) ||
            item.notas?.toLowerCase().includes(q);
          return coincideAmbito && coincideEstado && coincideBusqueda;
        });
      }, [compromisosOrdenados, filtroAmbito, filtroEstado, busqueda]);

      const estadisticas = useMemo(() => {
        const total = compromisos.length;
        const pendientes = compromisos.filter((c) => !c.completado).length;
        const deHoy = compromisosOrdenados.filter((c) => c.fecha === hoyISO);
        const porAmbito = {
          'Arte y Video': {
            total: compromisos.filter((c) => c.ambito === 'Arte y Video').length,
            pendientes: compromisos.filter((c) => c.ambito === 'Arte y Video' && !c.completado).length
          },
          'Preparatoria Lázaro Cárdenas': {
            total: compromisos.filter((c) => c.ambito === 'Preparatoria Lázaro Cárdenas').length,
            pendientes: compromisos.filter((c) => c.ambito === 'Preparatoria Lázaro Cárdenas' && !c.completado).length
          },
          'Personal': {
            total: compromisos.filter((c) => c.ambito === 'Personal').length,
            pendientes: compromisos.filter((c) => c.ambito === 'Personal' && !c.completado).length
          }
        };
        return { total, pendientes, deHoy, porAmbito };
      }, [compromisos, compromisosOrdenados, hoyISO]);

      // Calendario Mensual y Semanal
      const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const diasSemanaCorto = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

      const obtenerDiasDelMes = (fechaBase) => {
        const year = fechaBase.getFullYear();
        const month = fechaBase.getMonth();
        const primerDiaMes = new Date(year, month, 1);
        const ultimoDiaMes = new Date(year, month + 1, 0);
        const dias = [];
        const offsetInicio = primerDiaMes.getDay();

        for (let i = offsetInicio - 1; i >= 0; i--) {
          const d = new Date(year, month, -i);
          dias.push({ fechaObj: d, iso: formatDateISO(d), esMesActual: false });
        }
        for (let d = 1; d <= ultimoDiaMes.getDate(); d++) {
          const dateObj = new Date(year, month, d);
          dias.push({ fechaObj: dateObj, iso: formatDateISO(dateObj), esMesActual: true });
        }
        const restantes = 42 - dias.length;
        for (let i = 1; i <= restantes; i++) {
          const d = new Date(year, month + 1, i);
          dias.push({ fechaObj: d, iso: formatDateISO(d), esMesActual: false });
        }
        return dias;
      };

      const obtenerDiasDeLaSemana = (fechaBase) => {
        const start = new Date(fechaBase);
        start.setDate(start.getDate() - start.getDay());
        const dias = [];
        for (let i = 0; i < 7; i++) {
          const d = addDays(start, i);
          dias.push({ fechaObj: d, iso: formatDateISO(d), esMesActual: true });
        }
        return dias;
      };

      const navegarCalendario = (direccion) => {
        const nueva = new Date(fechaCursor);
        if (modoCalendario === 'mes') nueva.setMonth(nueva.getMonth() + direccion);
        else nueva.setDate(nueva.getDate() + direccion * 7);
        setFechaCursor(nueva);
      };

      const formatearFechaHumana = (isoStr) => {
        if (!isoStr) return '';
        const [y, m, d] = isoStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
      };

      // Exportar / Importar Archivo JSON
      const exportarJSON = () => {
        const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ compromisos, vocabulario }, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", str);
        a.setAttribute("download", `agenda-javier-${hoyISO}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const importarJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data.compromisos)) {
              actualizarYPublicarCompromisos(data.compromisos, 'Respaldo restaurado y sincronizado');
            }
            if (Array.isArray(data.vocabulario)) {
              setVocabulario(data.vocabulario);
              guardarEnBDLocal('agenda_javier_vocab_v3', data.vocabulario);
            }
          } catch {
            mostrarMensaje('Archivo inválido', 'alerta');
          }
        };
        reader.readAsText(file);
      };

      // Generar enlace de emparejamiento rápido para otros dispositivos (QR)
      const urlEmparejamiento = useMemo(() => {
        try {
          const base = window.location.origin + window.location.pathname;
          const payload = { syncConfig };
          return `${base}#pair=${utf8ToBase64(JSON.stringify(payload))}`;
        } catch {
          return window.location.href;
        }
      }, [syncConfig]);

      // Tarjeta de Compromiso
      const TarjetaCompromiso = ({ item }) => {
        const configAmbito = AMBITOS[item.ambito] || AMBITOS['Personal'];
        const configPrioridad = PRIORIDADES[item.prioridad] || PRIORIDADES['Media'];

        return (
          <div className={`relative group rounded-2xl border p-4 transition-all bg-white dark:bg-slate-900 shadow-xs hover:shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4 overflow-hidden ${item.completado ? 'opacity-60 border-slate-200 dark:border-slate-800' : 'border-slate-200 dark:border-slate-800'}`}>
            <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${configAmbito.dotClass}`} />
            <div className="flex items-start gap-3.5 pl-2">
              <button
                onClick={() => alternarCompletado(item)}
                className="mt-1 text-slate-400 hover:text-emerald-500 transition-colors"
                title={item.completado ? 'Marcar como pendiente' : 'Marcar como completado'}
              >
                <Icon name={item.completado ? 'check-circle-2' : 'circle'} className={`w-5 h-5 ${item.completado ? 'text-emerald-500' : ''}`} />
              </button>
              <div className="space-y-1">
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${configAmbito.badgeClass}`}>
                    {configAmbito.nombre}
                  </span>
                  {item.subcategoria && (
                    <span className="text-xs font-medium px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      {item.subcategoria}
                    </span>
                  )}
                  <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-md border ${configPrioridad.color}`}>
                    Prioridad {item.prioridad}
                  </span>
                </div>
                <h4 className={`font-bold text-sm sm:text-base ${item.completado ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'}`}>
                  {item.titulo}
                </h4>
                {item.notas && (
                  <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">{item.notas}</p>
                )}
              </div>
            </div>

            <div className="flex sm:flex-col items-center sm:items-end justify-between gap-2 shrink-0 pl-2 sm:pl-0 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100 dark:border-slate-800">
              <div className="text-xs font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                <Icon name="clock" className="w-3.5 h-3.5 text-slate-400" />
                <span>{item.fecha} · {item.horaInicio} - {item.horaFin}</span>
              </div>
              <div className="flex items-center gap-1">
                <button
                  onClick={() => abrirModalEditar(item)}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-slate-800"
                  title="Editar"
                >
                  <Icon name="edit-3" className="w-4 h-4" />
                </button>
                <button
                  onClick={() => eliminarCompromiso(item.id)}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40"
                  title="Eliminar"
                >
                  <Icon name="trash-2" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>
        );

                  <div className="grid grid-cols-3 gap-2.5">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Fecha</label>
                      <input
                        type="date"
                        value={formData.fecha}
                        onChange={(e) => setFormData({ ...formData, fecha: e.target.value })}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs sm:text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Hora Inicio</label>
                      <input
                        type="time"
                        value={formData.horaInicio}
                        onChange={(e) => setFormData({ ...formData, horaInicio: e.target.value })}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs sm:text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Hora Fin</label>
                      <input
                        type="time"
                        value={formData.horaFin}
                        onChange={(e) => setFormData({ ...formData, horaFin: e.target.value })}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs sm:text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-xs font-bold uppercase text-slate-500">Notas</label>
                      <button
                        type="button"
                        onClick={() => alternarReconocimientoVoz('notas')}
                        className="text-xs text-rose-500 font-bold flex items-center gap-1"
                      >
                        <Icon name="mic" className="w-3.5 h-3.5" />
                        <span>{escuchandoVoz && campoDictadoActivo === 'notas' ? 'Escuchando...' : 'Dictar nota'}</span>
                      </button>
                    </div>
                    <textarea
                      rows="2"
                      value={formData.notas}
                      onChange={(e) => setFormData({ ...formData, notas: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setModalAbierto(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow"
                    >
                      Guardar Compromiso
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DICTADO POR VOZ INTELIGENTE */}
          {modalVozAbierto && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setTabModalVoz('dictar')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                        tabModalVoz === 'dictar' ? 'bg-rose-600 text-white' : 'bg-slate-100 dark:bg-slate-800'
                      }`}
                    >
                      Asistente de Voz
                    </button>
                    <button
                      onClick={() => setTabModalVoz('vocabulario')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold ${
                        tabModalVoz === 'vocabulario' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'
                      }`}
                    >
                      Diccionario Fonético ({vocabulario.length})
                    </button>
                  </div>
                  <button onClick={() => setModalVozAbierto(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {tabModalVoz === 'dictar' ? (
                  <div className="space-y-4">
                    <div className="flex flex-col items-center justify-center py-4 bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2.5">
                      <button
                        type="button"
                        onClick={() => alternarReconocimientoVoz('inteligente')}
                        className={`w-16 h-16 rounded-full flex items-center justify-center text-white shadow-lg transition ${
                          escuchandoVoz ? 'bg-rose-600 mic-pulse' : 'bg-indigo-600 hover:bg-indigo-500'
                        }`}
                      >
                        <Icon name="mic" className="w-7 h-7" />
                      </button>
                      <p className="text-xs font-bold">
                        {escuchandoVoz ? 'Escuchando en Español (es-MX)... Habla ahora' : 'Toca el micrófono para dictar o escribe abajo'}
                      </p>
                    </div>

                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={textoDictado}
                        onChange={(e) => {
                          setTextoDictado(e.target.value);
                          setPropuestaVoz(analizarTextoLocalmente(e.target.value));
                        }}
                        placeholder="Ej. Mañana a las 4 pm sesión en Arte y Video prioridad alta..."
                        className="flex-1 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs sm:text-sm"
                      />
                      <button
                        type="button"
                        onClick={() => procesarDictado(textoDictado)}
                        className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                      >
                        Analizar
                      </button>
                    </div>

                    <div className="space-y-1.5">
                      <p className="text-[11px] font-bold uppercase text-slate-400">Frases de prueba (clic para simular):</p>
                      <div className="grid grid-cols-1 gap-1.5">
                        {EJEMPLOS_DICTADO.map((ej, i) => (
                          <button
                            key={i}
                            type="button"
                            onClick={() => procesarDictado(ej)}
                            className="text-left text-xs p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 text-slate-700 dark:text-slate-300 transition"
                          >
                            "{ej}"
                          </button>
                        ))}
                      </div>
                    </div>

                    {propuestaVoz && (
                      <div className="p-4 rounded-xl border border-indigo-300 dark:border-indigo-800 bg-indigo-50/40 dark:bg-indigo-950/30 space-y-2 text-xs">
                        <div className="font-extrabold text-indigo-600 dark:text-indigo-400 uppercase">Compromiso Detectado:</div>
                        <div className="font-bold text-sm">{propuestaVoz.titulo}</div>
                        <div className="grid grid-cols-2 gap-2 text-slate-600 dark:text-slate-300">
                          <div><strong>Ámbito:</strong> {propuestaVoz.ambito}</div>
                          <div><strong>Subcategoría:</strong> {propuestaVoz.subcategoria}</div>
                          <div><strong>Fecha:</strong> {propuestaVoz.fecha}</div>
                          <div><strong>Horario:</strong> {propuestaVoz.horaInicio} - {propuestaVoz.horaFin}</div>
                        </div>
                        <div className="pt-2 flex justify-end">
                          <button
                            type="button"
                            onClick={confirmarPropuestaVoz}
                            className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow"
                          >
                            Confirmar y Guardar en Agenda
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <input
                        type="text"
                        placeholder="Término correcto (ej. Vértice)"
                        value={nuevoTermino.termino}
                        onChange={(e) => setNuevoTermino({ ...nuevoTermino, termino: e.target.value })}
                        className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                      />
                      <input
                        type="text"
                        placeholder="Variantes (ej. vertice, bertice)"
                        value={nuevoTermino.variantes}
                        onChange={(e) => setNuevoTermino({ ...nuevoTermino, variantes: e.target.value })}
                        className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          if (!nuevoTermino.termino.trim()) return;
                          const nueva = [
                            ...vocabulario,
                            {
                              id: 'voc-' + Date.now(),
                              termino: nuevoTermino.termino.trim(),
                              variantes: nuevoTermino.variantes.trim() || nuevoTermino.termino.toLowerCase(),
                              categoria: 'Personalizado'
                            }
                          ];
                          setVocabulario(nueva);
                          guardarEnBDLocal('agenda_javier_vocab_v3', nueva);
                          setNuevoTermino({ termino: '', variantes: '', categoria: 'Arte y Video' });
                        }}
                        className="px-3 py-2 rounded-lg bg-indigo-600 text-white font-bold text-xs"
                      >
                        + Añadir
                      </button>
                    </div>
                    <div className="space-y-2 max-h-60 overflow-y-auto">
                      {vocabulario.map((v) => (
                        <div key={v.id} className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-bold">{v.termino}</span>
                            <span className="text-slate-400 ml-2">({v.variantes})</span>
                          </div>
                          <button
                            onClick={() => {
                              const filtrada = vocabulario.filter((i) => i.id !== v.id);
                              setVocabulario(filtrada);
                              guardarEnBDLocal('agenda_javier_vocab_v3', filtrada);
                            }}
                            className="text-slate-400 hover:text-rose-500"
                          >
                            <Icon name="trash-2" className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL DE SINCRONIZACIÓN MULTI-DISPOSITIVO SIN FIREBASE */}
          {modalSyncAbierto && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-5 max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <div>
                    <h3 className="font-extrabold text-base sm:text-lg">
                      Almacenamiento Local + Sincronización Sin Firebase
                    </h3>
                    <p className="text-xs text-slate-500">
                      Tus datos ya están guardados en este dispositivo (IndexedDB). Elige cómo sincronizarlos con tu iPad, celular y PC:
                    </p>
                  </div>
                  <button onClick={() => setModalSyncAbierto(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Selector de pestaña de sincronización */}
                <div className="flex flex-wrap gap-1.5 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-xl">
                  {[
                    { id: 'github', label: '1. Tu propio GitHub (Automático)', icon: 'git-branch' },
                    { id: 'qr', label: '2. Vincular Celular / iPad por QR', icon: 'qr-code' },
                    { id: 'google', label: '3. Google Sheets / Drive', icon: 'table' },
                    { id: 'archivo', label: '4. Archivo Local (.json)', icon: 'hard-drive' }
                  ].map((t) => (
                    <button
                      key={t.id}
                      onClick={() => setTabModalSync(t.id)}
                      className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-bold transition ${
                        tabModalSync === t.id
                          ? 'bg-indigo-600 text-white shadow'
                          : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
                      }`}
                    >
                      <Icon name={t.icon} className="w-3.5 h-3.5" />
                      <span>{t.label}</span>
                    </button>
                  ))}
                </div>

                {/* OPCIÓN 1: USAR EL MISMO REPOSITORIO DE GITHUB COMO NUBE */}
                {tabModalSync === 'github' && (
                  <div className="space-y-4 text-xs sm:text-sm">
                    <div className="p-3.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 text-xs space-y-1.5">
                      <p className="font-bold text-indigo-900 dark:text-indigo-200">
                        ¿Cómo funciona esto sin Firebase?
                      </p>
                      <p className="text-indigo-800 dark:text-indigo-300 leading-relaxed">
                        Como tu página ya está alojada en GitHub, este programa guarda un archivo llamado <code>agenda-datos.json</code> directamente dentro de tu propio repositorio cada vez que agregas o editas un compromiso.
                      </p>
                      <p className="text-indigo-800 dark:text-indigo-300">
                        Solo necesitas crear un <strong>Token en GitHub</strong> (Menú de perfil en GitHub → <em>Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token</em>, marca la casilla <strong>repo</strong> y cópialo aquí).
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Tu Usuario GitHub</label>
                        <input
                          type="text"
                          value={syncConfig.ghOwner}
                          onChange={(e) => setSyncConfig({ ...syncConfig, metodo: 'github', ghOwner: e.target.value })}
                          placeholder="ej. javier-tapia"
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Nombre del Repositorio</label>
                        <input
                          type="text"
                          value={syncConfig.ghRepo}
                          onChange={(e) => setSyncConfig({ ...syncConfig, metodo: 'github', ghRepo: e.target.value })}
                          placeholder="ej. agenda-integral"
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Rama (Branch)</label>
                        <input
                          type="text"
                          value={syncConfig.ghBranch}
                          onChange={(e) => setSyncConfig({ ...syncConfig, metodo: 'github', ghBranch: e.target.value })}
                          placeholder="main"
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Token Personal de GitHub (ghp_...)</label>
                      <input
                        type="password"
                        value={syncConfig.ghToken}
                        onChange={(e) => setSyncConfig({ ...syncConfig, metodo: 'github', ghToken: e.target.value })}
                        placeholder="Pega aquí tu token ghp_xxxxxxxxxxxx"
                        className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-mono"
                      />
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => {
                            localStorage.setItem('agenda_javier_sync_cfg_v3', JSON.stringify(syncConfig));
                            sincronizarConNubePropia('push', compromisos, vocabulario);
                            mostrarMensaje('Subiendo agenda a tu repositorio de GitHub...');
                          }}
                          className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold"
                        >
                          Guardar y Subir mis Datos Ahora
                        </button>
                        <button
                          type="button"
                          onClick={() => {
                            localStorage.setItem('agenda_javier_sync_cfg_v3', JSON.stringify(syncConfig));
                            sincronizarConNubePropia('pull');
                            mostrarMensaje('Descargando datos desde tu GitHub...');
                          }}
                          className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold"
                        >
                          Descargar de GitHub
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* OPCIÓN 2: EMPAREJAMIENTO POR CÓDIGO QR PARA EL CELULAR E IPAD */}
                {tabModalSync === 'qr' && (
                  <div className="space-y-4 text-center py-2">
                    <p className="text-xs text-slate-600 dark:text-slate-300 max-w-md mx-auto">
                      Una vez que pongas tu Token de GitHub en tu computadora, <strong>escanea este código QR con la cámara de tu iPad o celular</strong>. Se abrirá tu agenda ya conectada automáticamente sin tener que escribir el token a mano:
                    </p>
                    <div className="inline-block p-4 bg-white rounded-2xl border border-slate-200 shadow-md">
                      <img
                        src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(urlEmparejamiento)}`}
                        alt="Código QR de Sincronización"
                        className="w-44 h-44 mx-auto"
                      />
                    </div>
                    <div className="pt-1">
                      <button
                        type="button"
                        onClick={() => {
                          navigator.clipboard.writeText(urlEmparejamiento);
                          mostrarMensaje('Enlace de vinculación copiado al portapapeles');
                        }}
                        className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                      >
                        Copiar Enlace de Vinculación Directa
                      </button>
                    </div>
                  </div>
                )}

                {/* OPCIÓN 3: GOOGLE SHEETS / DRIVE (APPS SCRIPT) */}
                {tabModalSync === 'google' && (
                  <div className="space-y-3 text-xs">
                    <p className="text-slate-600 dark:text-slate-300">
                      Si prefieres usar una Hoja de Cálculo de tu Google Drive como base de datos, pega aquí la URL de implementación de tu Google Apps Script:
                    </p>
                    <input
                      type="text"
                      value={syncConfig.googleScriptUrl}
                      onChange={(e) => setSyncConfig({ ...syncConfig, metodo: 'google', googleScriptUrl: e.target.value })}
                      placeholder="https://script.google.com/macros/s/.../exec"
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-mono"
                    />
                    <div className="flex justify-end">
                      <button
                        type="button"
                        onClick={() => {
                          localStorage.setItem('agenda_javier_sync_cfg_v3', JSON.stringify(syncConfig));
                          sincronizarConNubePropia('push', compromisos, vocabulario);
                          mostrarMensaje('Configuración de Google Drive guardada');
                        }}
                        className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                      >
                        Guardar y Sincronizar con Google
                      </button>
                    </div>
                  </div>
                )}

                {/* OPCIÓN 4: ARCHIVO LOCAL JSON */}
                {tabModalSync === 'archivo' && (
                  <div className="space-y-3 text-xs">
                    <p className="text-slate-600 dark:text-slate-300">
                      Descarga toda tu base de datos en un archivo <code>.json</code> o cárgala en otro equipo manualmente:
                    </p>
                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={exportarJSON}
                        className="px-4 py-2.5 rounded-xl bg-slate-800 text-white font-bold flex items-center gap-2"
                      >
                        <Icon name="download" className="w-4 h-4" />
                        <span>Descargar Base de Datos (.json)</span>
                      </button>
                      <label className="px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 font-bold cursor-pointer flex items-center gap-2">
                        <Icon name="upload" className="w-4 h-4" />
                        <span>Cargar Archivo (.json)</span>
                        <input type="file" accept=".json" onChange={importarJSON} className="hidden" />
                      </label>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
