      { id: 'voc-2', termino: 'Fuerza Puma', variantes: 'fuerza puma, fuersa puma, pumas prepa', categoria: 'Preparatoria Lázaro Cárdenas' },
      { id: 'voc-3', termino: '95.1 FM', variantes: '95.1, noventa y cinco punto uno, 95 1 fm, radio 95.1', categoria: 'Preparatoria Lázaro Cárdenas' },

    const EJEMPLOS_DICTADO = [

    const formatDateISO = (dateObj) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const addDays = (dateObj, days) => {
      const result = new Date(dateObj);
      result.setDate(result.getDate() + days);
      return result;
    };

      return [

        },
        {
          id: 'demo-4',
          titulo: 'Retoque en Lightroom e Impresión Fine Art',
          ambito: 'Arte y Video',
          subcategoria: 'Impresión Fine Art / Lona',
          fecha: formatDateISO(manana),
          horaInicio: '09:30',
          horaFin: '12:30',
          prioridad: 'Media',
          notas: 'Verificar perfiles de color para ampliaciones.',
          completado: false,
          creadoEn: Date.now() - 14400000
        },
        {

        },
        {

          ambito: 'Personal',
          subcategoria: 'Trámites y Finanzas',
          fecha: formatDateISO(ayer),
          horaInicio: '11:00',

        {

          fecha: formatDateISO(pasado),

    };

    function App() {
      // Tema Oscuro / Claro
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('agenda_javier_dark_v2');
        return saved !== null ? JSON.parse(saved) : true;
      });

      useEffect(() => {
        localStorage.setItem('agenda_javier_dark_v2', JSON.stringify(darkMode));
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Navegación
      const [vistaActiva, setVistaActiva] = useState('dashboard'); // 'dashboard' | 'calendario' | 'lista'
      const [modoCalendario, setModoCalendario] = useState('mes'); // 'mes' | 'semana'

      // Compromisos y Vocabulario con guardado inmediato en LocalStorage
      const [compromisos, setCompromisos] = useState(() => {
        try {
          const saved = localStorage.getItem('agenda_javier_compromisos_v2');
          return saved ? JSON.parse(saved) : generarCompromisosIniciales();
        } catch {
          return generarCompromisosIniciales();
        }
      });

      const [vocabulario, setVocabulario] = useState(() => {
        try {
          const saved = localStorage.getItem('agenda_javier_vocab_v2');
          return saved ? JSON.parse(saved) : VOCABULARIO_INICIAL;
        } catch {
          return VOCABULARIO_INICIAL;
        }
      });

      useEffect(() => {
        localStorage.setItem('agenda_javier_compromisos_v2', JSON.stringify(compromisos));
      }, [compromisos]);

      useEffect(() => {
        localStorage.setItem('agenda_javier_vocab_v2', JSON.stringify(vocabulario));
      }, [vocabulario]);

      // Filtros
      const [filtroAmbito, setFiltroAmbito] = useState('Todos');
      const [filtroEstado, setFiltroEstado] = useState('Todos');
      const [busqueda, setBusqueda] = useState('');

      // Calendario
      const [fechaCursor, setFechaCursor] = useState(new Date());
      const [diaSeleccionado, setDiaSeleccionado] = useState(formatDateISO(new Date()));

      // Modales
      const [modalAbierto, setModalAbierto] = useState(false);
      const [compromisoEditando, setCompromisoEditando] = useState(null);
      const [notificacion, setNotificacion] = useState(null);

      // Dictado por Voz
      const [modalVozAbierto, setModalVozAbierto] = useState(false);
      const [tabModalVoz, setTabModalVoz] = useState('dictar'); // 'dictar' | 'vocabulario'
      const [escuchandoVoz, setEscuchandoVoz] = useState(false);
      const [campoDictadoActivo, setCampoDictadoActivo] = useState(null);
      const [textoDictado, setTextoDictado] = useState('');
      const [propuestaVoz, setPropuestaVoz] = useState(null);
      const recognitionRef = useRef(null);
      const [nuevoTermino, setNuevoTermino] = useState({ termino: '', variantes: '', categoria: 'Arte y Video' });

      // Nube (Firebase opcional) y Respaldos
      const [modalNubeAbierto, setModalNubeAbierto] = useState(false);
      const [firebaseConfigStr, setFirebaseConfigStr] = useState(() => localStorage.getItem('agenda_javier_fb_v2') || '');
      const [sincronizadoNube, setSincronizadoNube] = useState(false);
      const dbRef = useRef(null);

      // Formulario
      const [formData, setFormData] = useState({
        titulo: '',
        ambito: 'Arte y Video',
        subcategoria: 'Sesión Fotográfica',
        fecha: formatDateISO(new Date()),
        horaInicio: '09:00',
        horaFin: '10:30',
        prioridad: 'Media',
        notas: '',
        completado: false
      });

      const mostrarMensaje = (texto, tipo = 'exito') => {
        setNotificacion({ texto, tipo });
        setTimeout(() => setNotificacion(null), 3200);
      };

      // Conexión con Firebase si el usuario configura sus llaves
      useEffect(() => {
        if (!firebaseConfigStr.trim()) return;
        try {
          let limpio = firebaseConfigStr.trim();
          const matchObj = limpio.match(/\{[\s\S]*\}/);
          if (matchObj) limpio = matchObj[0];
          const jsonStr = limpio
            .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*\}/g, '}');
          const config = JSON.parse(jsonStr);

          if (config.apiKey && config.projectId && window.firebase) {
            if (!window.firebase.apps.length) {
              window.firebase.initializeApp(config);
            }
            const auth = window.firebase.auth();
            const db = window.firebase.firestore();
            dbRef.current = db;

            auth.signInAnonymously().then(() => {
              setSincronizadoNube(true);
              db.collection('agenda_compromisos_v2').onSnapshot((snap) => {
                if (!snap.empty) {
                  setCompromisos(snap.docs.map(d => ({ ...d.data(), id: d.id })));
                }
              });
            }).catch(() => {});
          }
        } catch (e) {}
      }, [firebaseConfigStr]);

      // Corrección fonética personalizada
      const aplicarVocabularioPersonalizado = (textoOriginal) => {
        if (!textoOriginal) return '';
        let resultado = textoOriginal;
        vocabulario.forEach((item) => {
          const listaVariantes = (item.variantes || '')
            .split(',')
            .map((v) => v.trim())
            .filter(Boolean);
          const todas = Array.from(new Set([...listaVariantes, item.termino]));
          todas.forEach((variante) => {
            if (!variante) return;
            const escapado = variante.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`\\b${escapado}\\b`, 'gi');
            resultado = resultado.replace(regex, item.termino);
          });
        });
        return resultado;
      };

      // Analizador inteligente de lenguaje natural en español
      const analizarTextoLocalmente = (textoBruto) => {
        const texto = aplicarVocabularioPersonalizado(textoBruto);
        const lower = texto.toLowerCase();
        const hoy = new Date();

        let ambito = 'Arte y Video';
        if (
          lower.includes('prepa') || lower.includes('lázaro cárdenas') || lower.includes('lazaro cardenas') ||
          lower.includes('radio') || lower.includes('95.1') || lower.includes('taller de medios') ||
          lower.includes('fuerza puma') || lower.includes('clase') || lower.includes('alumno') ||
          lower.includes('concurso') || lower.includes('vértice') || lower.includes('vertice')
        ) {
          ambito = 'Preparatoria Lázaro Cárdenas';
        } else if (
          lower.includes('personal') || lower.includes('familia') || lower.includes('médico') ||
          lower.includes('salud') || lower.includes('casa') || lower.includes('hogar') ||
          lower.includes('cena') || lower.includes('descanso') || lower.includes('trámite')
        ) {
          ambito = 'Personal';
        }

        let subcategoria = AMBITOS[ambito].subcategorias[0];
        if (ambito === 'Arte y Video') {
          if (lower.includes('edición') || lower.includes('editar') || lower.includes('lightroom')) subcategoria = 'Edición de Video / Foto';
          else if (lower.includes('fine art') || lower.includes('impresión') || lower.includes('lona') || lower.includes('ampliación')) subcategoria = 'Impresión Fine Art / Lona';
          else if (lower.includes('cliente') || lower.includes('cotización') || lower.includes('entrega')) subcategoria = 'Atención a Clientes';
          else subcategoria = 'Sesión Fotográfica';
        } else if (ambito === 'Preparatoria Lázaro Cárdenas') {
          if (lower.includes('95.1') || lower.includes('radio') || lower.includes('cabina')) subcategoria = 'Radio Escolar 95.1 FM';
          else if (lower.includes('taller de medios') || lower.includes('medios')) subcategoria = 'Taller de Medios';
          else if (lower.includes('proyecto') || lower.includes('concurso') || lower.includes('vértice') || lower.includes('fuerza puma')) subcategoria = 'Proyecto Educativo / Concurso';
          else if (lower.includes('califica') || lower.includes('revisión')) subcategoria = 'Revisión y Calificaciones';
          else if (lower.includes('junta') || lower.includes('reunión')) subcategoria = 'Reunión Académica';
          else subcategoria = 'Clase Frente a Grupo';
        } else {
          if (lower.includes('salud') || lower.includes('médico') || lower.includes('ejercicio')) subcategoria = 'Salud y Ejercicio';
          else if (lower.includes('trámite') || lower.includes('pago') || lower.includes('banco')) subcategoria = 'Trámites y Finanzas';
          else if (lower.includes('descanso') || lower.includes('ocio')) subcategoria = 'Descanso / Ocio';
          else subcategoria = 'Familia y Hogar';
        }

        let fechaObj = new Date(hoy);
        if (lower.includes('pasado mañana')) {
          fechaObj = addDays(hoy, 2);
        } else if (lower.includes('mañana') && !lower.includes('de la mañana')) {
          fechaObj = addDays(hoy, 1);
        } else {
          const diasNombres = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
          diasNombres.forEach((diaNombre, idx) => {
            if (lower.includes(`el ${diaNombre}`) || lower.startsWith(diaNombre)) {
              const actual = hoy.getDay();
              let diff = (idx - actual + 7) % 7;
              if (diff === 0) diff = 7;
              fechaObj = addDays(hoy, diff);
            }
          });
        }
        const fecha = formatDateISO(fechaObj);

        let horaInicio = '09:00';
        let horaFin = '10:30';
        const matchHora = lower.match(/a las (\d{1,2})(?::(\d{2}))?\s*(am|pm|de la tarde|de la noche|de la mañana)?/i);
        if (matchHora) {
          let h = parseInt(matchHora[1], 10);
          const m = matchHora[2] ? parseInt(matchHora[2], 10) : 0;
          const periodo = (matchHora[3] || '').toLowerCase();
          if ((periodo.includes('pm') || periodo.includes('tarde') || periodo.includes('noche')) && h < 12) {
            h += 12;
          } else if (periodo.includes('mañana') && h === 12) {
            h = 0;
          }
          horaInicio = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          const hFin = Math.min(23, h + 1);
          horaFin = `${String(hFin).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        let prioridad = 'Media';
        if (lower.includes('prioridad alta') || lower.includes('urgente') || lower.includes('importante')) {
          prioridad = 'Alta';
        } else if (lower.includes('prioridad baja') || lower.includes('sin prisa')) {
          prioridad = 'Baja';
        }

        let tituloLimpio = texto
          .replace(/^(agendar|programar|anotar|crear|guardar)\s+/i, '')
          .replace(/\b(hoy|mañana|pasado mañana|el lunes|el martes|el miércoles|el jueves|el viernes|el sábado|el domingo)\b/gi, '')
          .replace(/a las \d{1,2}(:\d{2})?\s*(am|pm|de la tarde|de la noche|de la mañana|horas|hrs)?/gi, '')
          .replace(/con prioridad (alta|media|baja)/gi, '')
          .replace(/en el ámbito (de )?(arte y video|preparatoria lázaro cárdenas|personal)/gi, '')
          .replace(/en (arte y video|la preparatoria lázaro cárdenas|preparatoria lázaro cárdenas|ámbito personal)/gi, '')
          .replace(/\s+/g, ' ')
          .trim();

        if (tituloLimpio.length > 0) {
          tituloLimpio = tituloLimpio.charAt(0).toUpperCase() + tituloLimpio.slice(1);
        } else {
          tituloLimpio = `${subcategoria} (${ambito})`;
        }

        return {
          titulo: tituloLimpio,
          ambito,
          subcategoria,
          fecha,
          horaInicio,
          horaFin,
          prioridad,
          notas: `Dictado por voz: "${texto}"`
        };
      };

      const procesarDictado = (textoEntrada) => {
        const base = textoEntrada !== undefined ? textoEntrada : textoDictado;
        if (!base.trim()) {
          mostrarMensaje('Dicta o escribe una frase primero', 'alerta');
          return;
        }
        const corregido = aplicarVocabularioPersonalizado(base);
        setTextoDictado(corregido);
        const analizado = analizarTextoLocalmente(corregido);
        setPropuestaVoz(analizado);
      };

      const alternarReconocimientoVoz = (destino = 'inteligente') => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (escuchandoVoz && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
          setEscuchandoVoz(false);
          setCampoDictadoActivo(null);
          return;
        }

        if (!SpeechRecognition) {
          mostrarMensaje('Usa Chrome, Edge o Safari para activar el micrófono, o selecciona un ejemplo abajo.', 'alerta');
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'es-MX';
          recognition.continuous = false;
          recognition.interimResults = true;

          recognition.onstart = () => {
            setEscuchandoVoz(true);
            setCampoDictadoActivo(destino);
          };

          recognition.onresult = (event) => {
            let transcripcion = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              transcripcion += event.results[i][0].transcript;
            }
            const corregido = aplicarVocabularioPersonalizado(transcripcion);

            if (destino === 'inteligente') {
              setTextoDictado(corregido);
              setPropuestaVoz(analizarTextoLocalmente(corregido));
            } else if (destino === 'titulo') {
              setFormData((prev) => ({ ...prev, titulo: corregido }));
            } else if (destino === 'notas') {
              setFormData((prev) => ({ ...prev, notas: prev.notas ? `${prev.notas} ${corregido}`.trim() : corregido }));
            }
          };

          recognition.onerror = () => {
            setEscuchandoVoz(false);
            setCampoDictadoActivo(null);
            mostrarMensaje('Verifica el permiso del micrófono en tu navegador.', 'alerta');
          };

          recognition.onend = () => {
            setEscuchandoVoz(false);
            setCampoDictadoActivo(null);
          };

          recognitionRef.current = recognition;
          recognition.start();
        } catch (e) {
          setEscuchandoVoz(false);
          setCampoDictadoActivo(null);
        }
      };

      // CRUD Compromisos
      const abrirModalNuevo = (ambitoPredefinido = null, fechaPredefinida = null) => {
        const ambitoElegido = ambitoPredefinido && AMBITOS[ambitoPredefinido] ? ambitoPredefinido : 'Arte y Video';
        setCompromisoEditando(null);
        setFormData({
          titulo: '',
          ambito: ambitoElegido,
          subcategoria: AMBITOS[ambitoElegido].subcategorias[0],
          fecha: fechaPredefinida || formatDateISO(new Date()),
          horaInicio: '09:00',
          horaFin: '10:30',
          prioridad: 'Media',
          notas: '',
          completado: false
        });
        setModalAbierto(true);
      };

      const abrirModalEditar = (item) => {
        setCompromisoEditando(item);
        setFormData({
          titulo: item.titulo || '',
          ambito: item.ambito || 'Arte y Video',
          subcategoria: item.subcategoria || AMBITOS[item.ambito || 'Arte y Video'].subcategorias[0],
          fecha: item.fecha || formatDateISO(new Date()),
          horaInicio: item.horaInicio || '09:00',
          horaFin: item.horaFin || '10:30',
          prioridad: item.prioridad || 'Media',
          notas: item.notas || '',
          completado: Boolean(item.completado)
        });
        setModalAbierto(true);
      };

      const guardarCompromiso = (e) => {
        if (e) e.preventDefault();
        if (!formData.titulo.trim()) {
          mostrarMensaje('Ingresa un título para el compromiso', 'alerta');
          return;
        }
        const id = compromisoEditando ? compromisoEditando.id : `comp-${Date.now()}`;
        const nuevoObjeto = {
          ...formData,
          titulo: formData.titulo.trim(),
          id,
          creadoEn: compromisoEditando ? compromisoEditando.creadoEn : Date.now()
        };

        if (compromisoEditando) {
          setCompromisos((prev) => prev.map((c) => (c.id === id ? nuevoObjeto : c)));
        } else {
          setCompromisos((prev) => [...prev, nuevoObjeto]);
        }

        if (sincronizadoNube && dbRef.current) {
          dbRef.current.collection('agenda_compromisos_v2').doc(id).set(nuevoObjeto, { merge: true });
        }

        setModalAbierto(false);
        mostrarMensaje(compromisoEditando ? 'Compromiso actualizado' : 'Compromiso agendado correctamente');
      };

      const confirmarPropuestaVoz = () => {
        if (!propuestaVoz || !propuestaVoz.titulo) return;
        const id = `comp-${Date.now()}`;
        const nuevo = { ...propuestaVoz, id, completado: false, creadoEn: Date.now() };
        setCompromisos((prev) => [...prev, nuevo]);
        if (sincronizadoNube && dbRef.current) {
          dbRef.current.collection('agenda_compromisos_v2').doc(id).set(nuevo);
        }
        setPropuestaVoz(null);
        setTextoDictado('');
        setModalVozAbierto(false);
        mostrarMensaje('Compromiso por voz agendado con éxito');
      };

      const alternarCompletado = (item) => {
        const actualizado = { ...item, completado: !item.completado };
        setCompromisos((prev) => prev.map((c) => (c.id === item.id ? actualizado : c)));
        if (sincronizadoNube && dbRef.current) {
          dbRef.current.collection('agenda_compromisos_v2').doc(item.id).set(actualizado, { merge: true });
        }
        mostrarMensaje(actualizado.completado ? 'Marcado como completado' : 'Marcado como pendiente');
      };

      const eliminarCompromiso = (id) => {
        setCompromisos((prev) => prev.filter((c) => c.id !== id));
        if (sincronizadoNube && dbRef.current) {
          dbRef.current.collection('agenda_compromisos_v2').doc(id).delete();
        }
        mostrarMensaje('Compromiso eliminado');
      };

      // Cálculos y Estadísticas
      const hoyISO = formatDateISO(new Date());

      const compromisosOrdenados = useMemo(() => {
        return [...compromisos].sort((a, b) => {
          if (a.fecha !== b.fecha) return a.fecha.localeCompare(b.fecha);
          return (a.horaInicio || '00:00').localeCompare(b.horaInicio || '00:00');
        });
      }, [compromisos]);

      const compromisosFiltrados = useMemo(() => {
        return compromisosOrdenados.filter((item) => {
          const coincideAmbito = filtroAmbito === 'Todos' || item.ambito === filtroAmbito;
          const coincideEstado =
            filtroEstado === 'Todos' ||
            (filtroEstado === 'Pendientes' && !item.completado) ||
            (filtroEstado === 'Completados' && item.completado);
          const q = busqueda.toLowerCase().trim();
          const coincideBusqueda =
            !q ||
            item.titulo?.toLowerCase().includes(q) ||
            item.subcategoria?.toLowerCase().includes(q) ||
            item.notas?.toLowerCase().includes(q);
          return coincideAmbito && coincideEstado && coincideBusqueda;
        });
      }, [compromisosOrdenados, filtroAmbito, filtroEstado, busqueda]);

      const estadisticas = useMemo(() => {
        const total = compromisos.length;
        const pendientes = compromisos.filter((c) => !c.completado).length;
        const completados = compromisos.filter((c) => c.completado).length;
        const deHoy = compromisosOrdenados.filter((c) => c.fecha === hoyISO);
        const porAmbito = {
          'Arte y Video': {
            total: compromisos.filter((c) => c.ambito === 'Arte y Video').length,
            pendientes: compromisos.filter((c) => c.ambito === 'Arte y Video' && !c.completado).length
          },
          'Preparatoria Lázaro Cárdenas': {
            total: compromisos.filter((c) => c.ambito === 'Preparatoria Lázaro Cárdenas').length,
            pendientes: compromisos.filter((c) => c.ambito === 'Preparatoria Lázaro Cárdenas' && !c.completado).length
          },
          'Personal': {
            total: compromisos.filter((c) => c.ambito === 'Personal').length,
            pendientes: compromisos.filter((c) => c.ambito === 'Personal' && !c.completado).length
          }
        };
        return { total, pendientes, completados, deHoy, porAmbito };
      }, [compromisos, compromisosOrdenados, hoyISO]);

      // Utilidades de Calendario Mensual y Semanal
      const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const diasSemanaCorto = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

      const obtenerDiasDelMes = (fechaBase) => {
        const year = fechaBase.getFullYear();
        const month = fechaBase.getMonth();
        const primerDiaMes = new Date(year, month, 1);
        const ultimoDiaMes = new Date(year, month + 1, 0);
        const dias = [];
        const offsetInicio = primerDiaMes.getDay();

        for (let i = offsetInicio - 1; i >= 0; i--) {
          const d = new Date(year, month, -i);
          dias.push({ fechaObj: d, iso: formatDateISO(d), esMesActual: false });
        }
        for (let d = 1; d <= ultimoDiaMes.getDate(); d++) {
          const dateObj = new Date(year, month, d);
          dias.push({ fechaObj: dateObj, iso: formatDateISO(dateObj), esMesActual: true });
        }
        const restantes = 42 - dias.length;
        for (let i = 1; i <= restantes; i++) {
          const d = new Date(year, month + 1, i);
          dias.push({ fechaObj: d, iso: formatDateISO(d), esMesActual: false });
        }
        return dias;
      };

      const obtenerDiasDeLaSemana = (fechaBase) => {
        const start = new Date(fechaBase);
        const day = start.getDay();
        start.setDate(start.getDate() - day);
        const dias = [];
        for (let i = 0; i < 7; i++) {
          const d = addDays(start, i);
          dias.push({ fechaObj: d, iso: formatDateISO(d), esMesActual: true });
        }
        return dias;
      };

      const navegarCalendario = (direccion) => {
        const nueva = new Date(fechaCursor);
        if (modoCalendario === 'mes') nueva.setMonth(nueva.getMonth() + direccion);
        else nueva.setDate(nueva.getDate() + direccion * 7);
        setFechaCursor(nueva);
      };

      const formatearFechaHumana = (isoStr) => {
        if (!isoStr) return '';
        const [y, m, d] = isoStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
      };

      // Exportar e Importar Respaldo JSON
      const exportarJSON = () => {
        const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ compromisos, vocabulario }, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", str);
        a.setAttribute("download", `agenda-javier-${hoyISO}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const importarJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data.compromisos)) setCompromisos(data.compromisos);
            if (Array.isArray(data.vocabulario)) setVocabulario(data.vocabulario);
            mostrarMensaje('Respaldo restaurado con éxito');
          } catch {
            mostrarMensaje('Archivo inválido', 'alerta');
          }
        };
        reader.readAsText(file);
      };

      // Subcomponente Tarjeta de Compromiso
      const TarjetaCompromiso = ({ item }) => {
        const configAmbito = AMBITOS[item.ambito] || AMBITOS['Personal'];
        const configPrioridad = PRIORIDADES[item.prioridad] || PRIORIDADES['Media'];

        return (
          <div className={`relative group rounded-2xl border p-4 transition-all bg-white dark:bg-slate-900 shadow-xs hover:shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4 overflow-hidden ${item.completado ? 'opacity-60 border-slate-200 dark:border-slate-800' : 'border-slate-200 dark:border-slate-800'}`}>
            <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${configAmbito.dotClass}`} />
            <div className="flex items-start gap-3.5 pl-2">
              <button
                onClick={() => alternarCompletado(item)}
                className="mt-1 text-slate-400 hover:text-emerald-500 transition-colors"
                title={item.completado ? 'Marcar como pendiente' : 'Marcar como completado'}
              >
                <Icon name={item.completado ? 'check-circle-2' : 'circle'} className={`w-5 h-5 ${item.completado ? 'text-emerald-500' : ''}`} />
              </button>
              <div className="space-y-1">
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full border ${configAmbito.badgeClass}`}>
                    {configAmbito.nombre}
                  </span>
                  {item.subcategoria && (
                    <span className="text-xs font-medium px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      {item.subcategoria}
                    </span>
                  )}
                  <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-md border ${configPrioridad.color}`}>
                    Prioridad {item.prioridad}
                  </span>
                </div>
                <h4 className={`font-bold text-sm sm:text-base ${item.completado ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'}`}>
                  {item.titulo}
                </h4>
                {item.notas && (
                  <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">{item.notas}</p>
                )}
              </div>
            </div>

            <div className="flex sm:flex-col items-center sm:items-end justify-between gap-2 shrink-0 pl-2 sm:pl-0 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100 dark:border-slate-800">
              <div className="text-xs font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                <Icon name="clock" className="w-3.5 h-3.5 text-slate-400" />
                <span>{item.fecha} · {item.horaInicio} - {item.horaFin}</span>
              </div>
              <div className="flex items-center gap-1">
                <button
                  onClick={() => abrirModalEditar(item)}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-slate-800"
                  title="Editar"
                >
                  <Icon name="edit-3" className="w-4 h-4" />
                </button>
                <button
                  onClick={() => eliminarCompromiso(item.id)}
                  className="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40"
                  title="Eliminar"
                >
                  <Icon name="trash-2" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>
        );
      };

      const diasMesActual = useMemo(() => obtenerDiasDelMes(fechaCursor), [fechaCursor]);
      const diasSemanaActual = useMemo(() => obtenerDiasDeLaSemana(fechaCursor), [fechaCursor]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Notificación flotante */}
          {notificacion && (
            <div className="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl border bg-slate-900 text-white border-slate-700 flex items-center gap-2 text-xs sm:text-sm font-medium">
              <Icon name={notificacion.tipo === 'alerta' ? 'alert-circle' : 'check-circle-2'} className="w-4 h-4 text-amber-400" />
              <span>{notificacion.texto}</span>
            </div>
          )}

          {/* Barra Superior */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 via-indigo-600 to-emerald-500 flex items-center justify-center shadow-md">
                  <Icon name="calendar" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="font-extrabold text-base sm:text-lg tracking-tight leading-tight">
                    Agenda Integral 3 Ámbitos
                  </h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    Arte y Video · Prepa Lázaro Cárdenas · Personal
                  </p>
                </div>
              </div>

              {/* Pestañas Centrales */}
              <nav className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                {[
                  { id: 'dashboard', label: 'Resumen', icon: 'layout-dashboard' },
                  { id: 'calendario', label: 'Calendario', icon: 'calendar' },
                  { id: 'lista', label: 'Compromisos', icon: 'list-todo' }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setVistaActiva(tab.id)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition ${
                      vistaActiva === tab.id
                        ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-xs'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4" />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* Botones de Acción */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => {
                    setTabModalVoz('dictar');
                    setModalVozAbierto(true);
                  }}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs sm:text-sm font-bold shadow transition"
                >
                  <Icon name="mic" className="w-4 h-4" />
                  <span>Dictado Voz</span>
                </button>

                <button
                  onClick={() => abrirModalNuevo(filtroAmbito !== 'Todos' ? filtroAmbito : 'Arte y Video')}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-bold shadow transition"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span className="hidden sm:inline">Nuevo</span>
                </button>

                <button
                  onClick={() => setModalNubeAbierto(true)}
                  className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
                  title="Sincronización y Respaldo"
                >
                  <Icon name="settings-2" className="w-4 h-4" />
                </button>

                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
                  title="Cambiar tema claro/oscuro"
                >
                  <Icon name={darkMode ? 'sun' : 'moon'} className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* Contenido Principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
            {/* Tarjetas de los 3 Ámbitos */}
            <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {Object.values(AMBITOS).map((amb) => {
                const stats = estadisticas.porAmbito[amb.id] || { total: 0, pendientes: 0 };
                const porcentaje = estadisticas.total > 0 ? Math.round((stats.total / estadisticas.total) * 100) : 0;
                const activo = filtroAmbito === amb.id;

                return (
                  <div
                    key={amb.id}
                    onClick={() => setFiltroAmbito(activo ? 'Todos' : amb.id)}
                    className={`cursor-pointer rounded-2xl p-5 border transition-all bg-white dark:bg-slate-900 shadow-xs hover:shadow-md ${
                      activo ? 'ring-2 ring-indigo-500 border-indigo-500' : 'border-slate-200 dark:border-slate-800'
                    }`}
                  >
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <div className="flex items-center gap-3">
                        <div className={`w-11 h-11 rounded-xl ${amb.bgLight} ${amb.textClass} flex items-center justify-center border ${amb.borderLight}`}>
                          <Icon name={amb.icon} className="w-5 h-5" />
                        </div>
                        <div>
                          <h2 className="font-bold text-sm sm:text-base">{amb.nombre}</h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400">{stats.pendientes} pendientes · {stats.total} total</p>
                        </div>
                      </div>
                      <span className={`text-xs font-extrabold px-2.5 py-1 rounded-full border ${amb.badgeClass}`}>
                        {porcentaje}%
                      </span>
                    </div>

                    <div className="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-3">
                      <div className={`h-full ${amb.dotClass}`} style={{ width: `${porcentaje}%` }} />
                    </div>

                    <div className="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                      <span>{activo ? 'Filtro activo (clic para quitar)' : 'Clic para filtrar ámbito'}</span>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          abrirModalNuevo(amb.id);
                        }}
                        className={`font-bold ${amb.textClass} hover:underline`}
                      >
                        + Agendar
                      </button>
                    </div>
                  </div>
                );
              })}
            </section>

            {/* VISTA 1: DASHBOARD / RESUMEN */}
            {vistaActiva === 'dashboard' && (
              <div className="space-y-6">
                {/* Banner de Dictado por Voz Personalizado */}
                <div className="rounded-2xl p-5 bg-gradient-to-r from-indigo-950 via-slate-900 to-rose-950 text-white border border-indigo-800/50 shadow-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                  <div className="space-y-1">
                    <div className="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-amber-400">
                      <Icon name="wand-2" className="w-4 h-4" />
                      <span>Dictado Inteligente con Vocabulario Personalizado (es-MX)</span>
                    </div>
                    <h3 className="text-base sm:text-lg font-extrabold">
                      Agenda compromisos hablando con naturalidad
                    </h3>

                        value={nuevoTermino.termino}
                        onChange={(e) => setNuevoTermino({ ...nuevoTermino, termino: e.target.value })}
                        className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                      />
                      <input
                        type="text"
                        placeholder="Variantes (ej. vertice, bertice)"
                        value={nuevoTermino.variantes}
                        onChange={(e) => setNuevoTermino({ ...nuevoTermino, variantes: e.target.value })}
                        className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          if (!nuevoTermino.termino.trim()) return;
                          setVocabulario([
                            ...vocabulario,
                            {
                              id: 'voc-' + Date.now(),
                              termino: nuevoTermino.termino.trim(),
                              variantes: nuevoTermino.variantes.trim() || nuevoTermino.termino.toLowerCase(),
                              categoria: 'Personalizado'
                            }
                          ]);
                          setNuevoTermino({ termino: '', variantes: '', categoria: 'Arte y Video' });
                        }}
                        className="px-3 py-2 rounded-lg bg-indigo-600 text-white font-bold text-xs"
                      >
                        + Añadir
                      </button>
                    </div>
                    <div className="space-y-2 max-h-60 overflow-y-auto">
                      {vocabulario.map((v) => (
                        <div key={v.id} className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-bold">{v.termino}</span>
                            <span className="text-slate-400 ml-2">({v.variantes})</span>
                          </div>
                          <button
                            onClick={() => setVocabulario(vocabulario.filter((i) => i.id !== v.id))}
                            className="text-slate-400 hover:text-rose-500"
                          >
                            <Icon name="trash-2" className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL CONFIGURACIÓN NUBE Y RESPALDO */}
          {modalNubeAbierto && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <h3 className="font-bold text-base">Respaldo y Sincronización en la Nube</h3>
                  <button onClick={() => setModalNubeAbierto(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2">
                  <p className="text-xs font-bold uppercase text-slate-400">1. Respaldo en Archivo Local (.json)</p>
                  <div className="flex gap-2">
                    <button onClick={exportarJSON} className="px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">
                      Descargar Respaldo
                    </button>
                    <label className="px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold cursor-pointer">
                      Restaurar Archivo
                      <input type="file" accept=".json" onChange={importarJSON} className="hidden" />
                    </label>
                  </div>
                </div>

                <div className="space-y-2 pt-3 border-t border-slate-200 dark:border-slate-800">
                  <p className="text-xs font-bold uppercase text-slate-400">2. Firebase Realtime Config (Opcional)</p>
                  <textarea
                    rows="4"
                    value={firebaseConfigStr}
                    onChange={(e) => setFirebaseConfigStr(e.target.value)}
                    placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "..."}'
                    className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-mono"
                  />
                  <div className="flex justify-end">
                    <button
                      onClick={() => {
                        localStorage.setItem('agenda_javier_fb_v2', firebaseConfigStr);
                        setModalNubeAbierto(false);
                        mostrarMensaje('Configuración guardada');
                      }}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                    >
                      Guardar Configuración
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
