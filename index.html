<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Agenda Integral | Arte y Video · Prepa Lázaro Cárdenas · Personal</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel Standalone CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Compat SDKs (Opcional para sincronización en tiempo real entre dispositivos) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-pulse {
      animation: pulse-ring 1.6s infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 selection:bg-indigo-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Componente auxiliar para renderizar íconos de Lucide en navegador sin compilador
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: spanRef.current });
        }
      }, [name, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    // Configuración de los 3 Ámbitos
    const AMBITOS = {
      arte_video: {
        id: 'arte_video',
        nombre: 'Arte y Video',
        corto: 'Arte y Video',
        icono: 'camera',
        colorText: 'text-amber-800',
        colorBg: 'bg-amber-50',
        colorBorder: 'border-amber-300',
        badgeBg: 'bg-amber-100 text-amber-900 border-amber-300',
        accent: 'bg-amber-500',
        btnActive: 'bg-amber-600 text-white shadow-sm',
        subcategorias: [
          'Sesión Fotográfica',
          'Edición de Video / Foto',
          'Impresión Fine Art / Ampliaciones',
          'Atención a Clientes',
          'Cobertura de Evento'
        ]
      },
      prepa: {
        id: 'prepa',
        nombre: 'Preparatoria Lázaro Cárdenas',
        corto: 'Prepa Lázaro Cárdenas',
        icono: 'graduation-cap',
        colorText: 'text-indigo-800',
        colorBg: 'bg-indigo-50',
        colorBorder: 'border-indigo-300',
        badgeBg: 'bg-indigo-100 text-indigo-900 border-indigo-300',
        accent: 'bg-indigo-600',
        btnActive: 'bg-indigo-600 text-white shadow-sm',
        subcategorias: [
          'Clase Frente a Grupo',
          'Taller de Medios Digitales',
          'Radio Escolar Fuerza Puma 95.1 FM',
          'Concurso Vértice / Exposiciones',
          'Investigación / STEAM'
        ]
      },
      personal: {
        id: 'personal',
        nombre: 'Personal',
        corto: 'Personal',
        icono: 'heart',
        colorText: 'text-emerald-800',
        colorBg: 'bg-emerald-50',
        colorBorder: 'border-emerald-300',
        badgeBg: 'bg-emerald-100 text-emerald-900 border-emerald-300',
        accent: 'bg-emerald-500',
        btnActive: 'bg-emerald-600 text-white shadow-sm',
        subcategorias: [
          'Familia y Hogar',
          'Salud y Ejercicio',
          'Trámites y Finanzas',
          'Descanso / Lectura',
          'Otros'
        ]
      }
    };

    const VOCABULARIO_INICIAL = [
      { id: 'v1', incorrecto: 'cananea', correcto: 'Cananea', categoria: 'Lugar' },
      { id: 'v2', incorrecto: 'fuerza puma', correcto: 'Fuerza Puma 95.1 FM', categoria: 'Prepa' },
      { id: 'v3', incorrecto: 'taller de medios', correcto: 'Taller de Medios Digitales', categoria: 'Prepa' },
      { id: 'v4', incorrecto: 'lazaro cardenas', correcto: 'Preparatoria Lázaro Cárdenas', categoria: 'Prepa' },
      { id: 'v5', incorrecto: 'arte y video', correcto: 'Arte y Video Cananea', categoria: 'Estudio' },
      { id: 'v6', incorrecto: 'fine art', correcto: 'Impresión Fine Art', categoria: 'Estudio' },
      { id: 'v7', incorrecto: 'vertice', correcto: 'Vértice ENIEP', categoria: 'Prepa' },
      { id: 'v8', incorrecto: 'tierra y cobre', correcto: 'Cananea... Tierra y Cobre', categoria: 'Prepa' }
    ];

    const obtenerHoyISO = () => {
      const hoy = new Date();
      const offset = hoy.getTimezoneOffset();
      const local = new Date(hoy.getTime() - offset * 60 * 1000);
      return local.toISOString().split('T')[0];
    };

    const sumarDiasISO = (dias) => {
      const f = new Date();
      f.setDate(f.getDate() + dias);
      const offset = f.getTimezoneOffset();
      const local = new Date(f.getTime() - offset * 60 * 1000);
      return local.toISOString().split('T')[0];
    };

    const COMPROMISOS_MUESTRA = [
      {
        id: 'demo-1',
        titulo: 'Revisión de cuadros 6x8 para concurso Vértice Tierra y Cobre',
        ambito: 'prepa',
        subcategoria: 'Concurso Vértice / Exposiciones',
        fecha: obtenerHoyISO(),
        horaInicio: '10:00',
        horaFin: '11:30',
        prioridad: 'alta',
        notas: 'Verificar entregas digitales por WeTransfer y marcos físicos de los alumnos.',
        completado: false
      },
      {
        id: 'demo-2',
        titulo: 'Transmisión en cabina Fuerza Puma Producciones 95.1 FM',
        ambito: 'prepa',
        subcategoria: 'Radio Escolar Fuerza Puma 95.1 FM',
        fecha: obtenerHoyISO(),
        horaInicio: '12:30',
        horaFin: '14:00',
        prioridad: 'media',
        notas: 'Ajustar niveles de consola y guion con alumnos del Taller de Medios.',
        completado: false
      },
      {
        id: 'demo-3',
        titulo: 'Retoque en Lightroom y preparación de impresiones 16x20',
        ambito: 'arte_video',
        subcategoria: 'Impresión Fine Art / Ampliaciones',
        fecha: obtenerHoyISO(),
        horaInicio: '17:00',
        horaFin: '19:00',
        prioridad: 'alta',
        notas: 'Revisar perfiles de color en iPad Pro antes de enviar pedido.',
        completado: false
      },
      {
        id: 'demo-4',
        titulo: 'Cena en familia y descanso',
        ambito: 'personal',
        subcategoria: 'Familia y Hogar',
        fecha: obtenerHoyISO(),
        horaInicio: '20:30',
        horaFin: '22:00',
        prioridad: 'media',
        notas: 'Tiempo libre en casa.',
        completado: false
      }
    ];

    function App() {
      // Estados principales con persistencia en LocalStorage
      const [compromisos, setCompromisos] = useState(() => {
        try {
          const guardado = localStorage.getItem('agenda_javier_compromisos_v1');
          return guardado ? JSON.parse(guardado) : COMPROMISOS_MUESTRA;
        } catch {
          return COMPROMISOS_MUESTRA;
        }
      });

      const [vocabulario, setVocabulario] = useState(() => {
        try {
          const guardado = localStorage.getItem('agenda_javier_vocabulario_v1');
          return guardado ? JSON.parse(guardado) : VOCABULARIO_INICIAL;
        } catch {
          return VOCABULARIO_INICIAL;
        }
      });

      // Navegación y filtros
      const [vistaActiva, setVistaActiva] = useState('resumen'); // resumen | calendario | lista | vocabulario
      const [filtroAmbito, setFiltroAmbito] = useState('todos');
      const [filtroEstado, setFiltroEstado] = useState('pendientes'); // todos | pendientes | completados
      const [busqueda, setBusqueda] = useState('');
      const [fechaSeleccionada, setFechaSeleccionada] = useState(obtenerHoyISO());

      // Modal Crear / Editar Compromiso
      const [modalAbierto, setModalAbierto] = useState(false);
      const [editandoId, setEditandoId] = useState(null);
      const [form, setForm] = useState({
        titulo: '',
        ambito: 'arte_video',
        subcategoria: AMBITOS.arte_video.subcategorias[0],
        fecha: obtenerHoyISO(),
        horaInicio: '09:00',
        horaFin: '10:00',
        prioridad: 'media',
        notas: ''
      });

      // Estados para Dictado por Voz Inteligente
      const [modalVozAbierto, setModalVozAbierto] = useState(false);
      const [escuchando, setEscuchando] = useState(false);
      const [campoEscuchando, setCampoEscuchando] = useState(null); // 'asistente' | 'titulo' | 'notas'
      const [textoDictado, setTextoDictado] = useState('');
      const [errorVoz, setErrorVoz] = useState('');
      const recognitionRef = useRef(null);

      // Estado para nuevo término de vocabulario
      const [nuevoVocab, setNuevoVocab] = useState({ incorrecto: '', correcto: '', categoria: 'General' });

      // Estado para Sincronización Nube (Firebase opcional) y Respaldos
      const [modalNubeAbierto, setModalNubeAbierto] = useState(false);
      const [firebaseConfigStr, setFirebaseConfigStr] = useState(() => localStorage.getItem('agenda_javier_fb_config') || '');
      const [nubeConectada, setNubeConectada] = useState(false);
      const [mensajeNube, setMensajeNube] = useState('');
      const dbRef = useRef(null);

      // Guardar en LocalStorage automáticamente
      useEffect(() => {
        localStorage.setItem('agenda_javier_compromisos_v1', JSON.stringify(compromisos));
      }, [compromisos]);

      useEffect(() => {
        localStorage.setItem('agenda_javier_vocabulario_v1', JSON.stringify(vocabulario));
      }, [vocabulario]);

      // Conexión opcional con Firebase si el usuario pegó sus credenciales
      useEffect(() => {
        if (!firebaseConfigStr.trim()) return;
        try {
          let textoLimpio = firebaseConfigStr.trim();
          const matchObj = textoLimpio.match(/\{[\s\S]*\}/);
          if (matchObj) textoLimpio = matchObj[0];
          // Permitir sintaxis de objeto JS de la consola de Firebase convirtiéndolo a JSON válido
          const jsonValido = textoLimpio
            .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*\}/g, '}');
          const config = JSON.parse(jsonValido);

          if (config.apiKey && config.projectId && window.firebase) {
            if (!window.firebase.apps.length) {
              window.firebase.initializeApp(config);
            }
            const auth = window.firebase.auth();
            const db = window.firebase.firestore();
            dbRef.current = db;

            auth.signInAnonymously().then(() => {
              setNubeConectada(true);
              setMensajeNube('Conectado y sincronizando en tiempo real con Firebase.');
              db.collection('agenda_compromisos').onSnapshot((snap) => {
                if (!snap.empty) {
                  const remotos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                  setCompromisos(remotos);
                }
              });
            }).catch((err) => {
              setMensajeNube('Aviso Firebase Auth: Activa el acceso Anónimo en Firebase Console.');
            });
          }
        } catch (e) {
          console.warn('Configuración Firebase pendiente o inválida:', e);
        }
      }, [firebaseConfigStr]);

      // Función que aplica el vocabulario personalizado sobre el texto transcrito
      const aplicarCorreccionVocabulario = (texto) => {
        if (!texto) return '';
        let procesado = texto;
        vocabulario.forEach((item) => {
          if (item.incorrecto && item.correcto) {
            const regex = new RegExp(`\\b${item.incorrecto}\\b`, 'gi');
            procesado = procesado.replace(regex, item.correcto);
          }
        });
        return procesado;
      };

      // Intérprete inteligente en Español (es-MX) para extraer ámbito, fecha, hora y prioridad de una frase dictada
      const interpretarFraseNatural = (fraseRaw) => {
        const frase = aplicarCorreccionVocabulario(fraseRaw);
        const lower = frase.toLowerCase();

        // 1. Detectar Ámbito y Subcategoría
        let ambitoDetectado = 'personal';
        let subcategoriaDetectada = AMBITOS.personal.subcategorias[0];

        if (/(foto|sesi[oó]n|video|edici[oó]n|lightroom|impresi[oó]n|fine art|cliente|boda|estudio|c[aá]mara|retrato|ampliaci[oó]n)/.test(lower)) {
          ambitoDetectado = 'arte_video';
          if (/impresi[oó]n|fine art|ampliaci|cuadro|lona/.test(lower)) subcategoriaDetectada = 'Impresión Fine Art / Ampliaciones';
          else if (/edici[oó]n|lightroom|retocar|retoque/.test(lower)) subcategoriaDetectada = 'Edición de Video / Foto';
          else if (/cliente|cotizaci|entrega/.test(lower)) subcategoriaDetectada = 'Atención a Clientes';
          else subcategoriaDetectada = 'Sesión Fotográfica';
        } else if (/(prepa|clase|alumno|taller de medios|radio|fuerza puma|95\.1|v[eé]rtice|l[aá]zaro c[aá]rdenas|escuela|examen|profe|steam|expociencias)/.test(lower)) {
          ambitoDetectado = 'prepa';
          if (/radio|fuerza puma|95\.1|cabina/.test(lower)) subcategoriaDetectada = 'Radio Escolar Fuerza Puma 95.1 FM';
          else if (/taller de medios/.test(lower)) subcategoriaDetectada = 'Taller de Medios Digitales';
          else if (/v[eé]rtice|concurso|exposici[oó]n|tierra y cobre/.test(lower)) subcategoriaDetectada = 'Concurso Vértice / Exposiciones';
          else if (/steam|investigaci[oó]n|ciencia/.test(lower)) subcategoriaDetectada = 'Investigación / STEAM';
          else subcategoriaDetectada = 'Clase Frente a Grupo';
        } else {
          ambitoDetectado = 'personal';
          if (/salud|m[eé]dico|ejercicio|entrena/.test(lower)) subcategoriaDetectada = 'Salud y Ejercicio';
          else if (/pago|banco|tr[aá]mite|factura/.test(lower)) subcategoriaDetectada = 'Trámites y Finanzas';
          else subcategoriaDetectada = 'Familia y Hogar';
        }

        // 2. Detectar Fecha
        let fechaDetectada = obtenerHoyISO();
        if (/pasado ma[ñn]ana/.test(lower)) {
          fechaDetectada = sumarDiasISO(2);
        } else if (/ma[ñn]ana/.test(lower)) {
          fechaDetectada = sumarDiasISO(1);
        }

        // 3. Detectar Hora (ej. "a las 5 de la tarde", "a las 10:30")
        let horaInicio = '09:00';
        let horaFin = '10:00';
        const matchHora = lower.match(/a las (\d{1,2})(?::(\d{2}))?\s*(de la tarde|de la noche|de la ma[ñn]ana|pm|am)?/);
        if (matchHora) {
          let h = parseInt(matchHora[1], 10);
          const m = matchHora[2] ? matchHora[2] : '00';
          const periodo = matchHora[3] || '';
          if ((periodo.includes('tarde') || periodo.includes('noche') || periodo === 'pm') && h < 12) {
            h += 12;
          }
          horaInicio = `${String(h).padStart(2, '0')}:${m}`;
          const hFin = (h + 1) % 24;
          horaFin = `${String(hFin).padStart(2, '0')}:${m}`;
        }

        // 4. Detectar Prioridad
        let prioridadDetectada = 'media';
        if (/urgente|importante|prioridad alta|cr[ií]tico/.test(lower)) {
          prioridadDetectada = 'alta';
        } else if (/prioridad baja|sin prisa|opcional/.test(lower)) {
          prioridadDetectada = 'baja';
        }

        // Capitalizar primera letra
        const tituloLimpio = frase.charAt(0).toUpperCase() + frase.slice(1);

        return {
          titulo: tituloLimpio,
          ambito: ambitoDetectado,
          subcategoria: subcategoriaDetectada,
          fecha: fechaDetectada,
          horaInicio,
          horaFin,
          prioridad: prioridadDetectada,
          notas: `Creado por dictado de voz: "${frase}"`
        };
      };

      // Iniciar Reconocimiento de Voz Web Speech API
      const iniciarDictado = (modo = 'asistente') => {
        setErrorVoz('');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setErrorVoz('Tu navegador no soporta dictado por voz directo. Usa Chrome, Edge o Safari en un enlace HTTPS.');
          return;
        }

        if (escuchando && recognitionRef.current) {
          recognitionRef.current.stop();
          setEscuchando(false);
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'es-MX';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = () => {
          setEscuchando(true);
          setCampoEscuchando(modo);
          if (modo === 'asistente') setTextoDictado('');
        };

        recognition.onresult = (event) => {
          let transcripcion = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcripcion += event.results[i][0].transcript;
          }
          const corregido = aplicarCorreccionVocabulario(transcripcion);

          if (modo === 'asistente') {
            setTextoDictado(corregido);
            const interpretado = interpretarFraseNatural(corregido);
            setForm(interpretado);
          } else if (modo === 'titulo') {
            setForm((prev) => ({ ...prev, titulo: corregido }));
          } else if (modo === 'notas') {
            setForm((prev) => ({ ...prev, notas: prev.notas ? `${prev.notas} ${corregido}` : corregido }));
          }
        };

        recognition.onerror = (event) => {
          setEscuchando(false);
          setCampoEscuchando(null);
          if (event.error === 'not-allowed') {
            setErrorVoz('Permiso de micrófono bloqueado. Asegúrate de abrir la app desde GitHub Pages (HTTPS) y permitir el micrófono.');
          } else {
            setErrorVoz(`Aviso de micrófono: ${event.error}`);
          }
        };

        recognition.onend = () => {
          setEscuchando(false);
          setCampoEscuchando(null);
        };

        recognitionRef.current = recognition;
        recognition.start();
      };

      // Guardar o actualizar un compromiso
      const guardarCompromiso = (e) => {
        if (e) e.preventDefault();
        if (!form.titulo.trim()) return;

        if (editandoId) {
          const actualizados = compromisos.map((c) =>
            c.id === editandoId ? { ...c, ...form } : c
          );
          setCompromisos(actualizados);
          if (nubeConectada && dbRef.current) {
            dbRef.current.collection('agenda_compromisos').doc(editandoId).set({ ...form, completado: false }, { merge: true });
          }
        } else {
          const nuevo = {
            ...form,
            id: 'item-' + Date.now(),
            completado: false
          };
          setCompromisos([nuevo, ...compromisos]);
          if (nubeConectada && dbRef.current) {
            dbRef.current.collection('agenda_compromisos').doc(nuevo.id).set(nuevo);
          }
        }

        setModalAbierto(false);
        setModalVozAbierto(false);
        setEditandoId(null);
      };

      const alternarCompletado = (id) => {
        const actualizados = compromisos.map((c) =>
          c.id === id ? { ...c, completado: !c.completado } : c
        );
        setCompromisos(actualizados);
        const encontrado = actualizados.find((c) => c.id === id);
        if (nubeConectada && dbRef.current && encontrado) {
          dbRef.current.collection('agenda_compromisos').doc(id).update({ completado: encontrado.completado });
        }
      };

      const eliminarCompromiso = (id) => {
        setCompromisos(compromisos.filter((c) => c.id !== id));
        if (nubeConectada && dbRef.current) {
          dbRef.current.collection('agenda_compromisos').doc(id).delete();
        }
      };

      const abrirNuevoCompromiso = (ambitoInicial = 'arte_video') => {
        setEditandoId(null);
        setForm({
          titulo: '',
          ambito: ambitoInicial,
          subcategoria: AMBITOS[ambitoInicial].subcategorias[0],
          fecha: fechaSeleccionada || obtenerHoyISO(),
          horaInicio: '09:00',
          horaFin: '10:00',
          prioridad: 'media',
          notas: ''
        });
        setModalAbierto(true);
      };

      const abrirEdicion = (item) => {
        setEditandoId(item.id);
        setForm({
          titulo: item.titulo,
          ambito: item.ambito,
          subcategoria: item.subcategoria,
          fecha: item.fecha,
          horaInicio: item.horaInicio,
          horaFin: item.horaFin,
          prioridad: item.prioridad,
          notas: item.notas || ''
        });
        setModalAbierto(true);
      };

      // Exportar e Importar JSON para respaldo manual entre equipos
      const exportarRespaldoJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ compromisos, vocabulario }, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `respaldo-agenda-${obtenerHoyISO()}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const importarRespaldoJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (Array.isArray(data.compromisos)) setCompromisos(data.compromisos);
            if (Array.isArray(data.vocabulario)) setVocabulario(data.vocabulario);
            alert('Respaldo restaurado correctamente.');
          } catch {
            alert('El archivo seleccionado no es un respaldo válido.');
          }
        };
        reader.readAsText(file);
      };

      // Filtrado y métricas
      const compromisosFiltrados = useMemo(() => {
        return compromisos
          .filter((c) => (filtroAmbito === 'todos' ? true : c.ambito === filtroAmbito))
          .filter((c) => {
            if (filtroEstado === 'pendientes') return !c.completado;
            if (filtroEstado === 'completados') return c.completado;
            return true;
          })

            if (!busqueda.trim()) return true;
            const q = busqueda.toLowerCase();
            return (
              c.titulo.toLowerCase().includes(q) ||
              c.subcategoria.toLowerCase().includes(q) ||

          arte_video: compromisos.filter((c) => c.ambito === 'arte_video').length,
          prepa: compromisos.filter((c) => c.ambito === 'prepa').length,
          personal: compromisos.filter((c) => c.ambito === 'personal').length

        return {

          porcentajes: {
            arte_video: Math.round((conteo.arte_video / total) * 100),
            prepa: Math.round((conteo.prepa / total) * 100),
            personal: Math.round((conteo.personal / total) * 100)

          hoy: compromisos.filter((c) => c.fecha === obtenerHoyISO() && !c.completado).length

          lista.push({
            iso,
            diaSemana: d.toLocaleDateString('es-MX', { weekday: 'short' }),
            diaNumero: d.getDate(),
            mesCorto: d.toLocaleDateString('es-MX', { month: 'short' }),

                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>

            {/* VISTA 2: CALENDARIO SEMANAL Y POR DÍA */}

                  <input

                  {/* Subcategoría */}
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Subcategoría</label>
                    <select
                      value={form.subcategoria}
                      onChange={(e) => setForm({ ...form, subcategoria: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white"
                    >
                      {AMBITOS[form.ambito].subcategorias.map((sub) => (
                        <option key={sub} value={sub}>{sub}</option>
                      ))}
                    </select>
                  </div>

                  {/* Título con Micrófono Integrado */}
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Título del Compromiso</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        required
                        value={form.titulo}
                        onChange={(e) => setForm({ ...form, titulo: e.target.value })}
                        placeholder="Ej. Sesión de retrato en estudio / Clase Taller de Medios"
                        className="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-sm"
                      />
                      <button
                        type="button"
                        onClick={() => iniciarDictado('titulo')}
                        className={`px-3 rounded-xl border flex items-center justify-center ${
                          escuchando && campoEscuchando === 'titulo'
                            ? 'bg-rose-600 text-white border-rose-600 mic-pulse'
                            : 'bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200'
                        }`}
                        title="Dictar título"
                      >
                        <Icon name="mic" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>

                  {/* Fecha y Horas */}
                  <div className="grid grid-cols-3 gap-2.5">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Fecha</label>
                      <input
                        type="date"
                        value={form.fecha}
                        onChange={(e) => setForm({ ...form, fecha: e.target.value })}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Inicio</label>
                      <input
                        type="time"
                        value={form.horaInicio}
                        onChange={(e) => setForm({ ...form, horaInicio: e.target.value })}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Fin</label>
                      <input
                        type="time"
                        value={form.horaFin}
                        onChange={(e) => setForm({ ...form, horaFin: e.target.value })}
                        className="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm"
                      />
                    </div>
                  </div>

                  {/* Notas con Micrófono */}
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-xs font-bold uppercase text-slate-500">Notas o Detalles</label>
                      <button
                        type="button"
                        onClick={() => iniciarDictado('notas')}
                        className="text-xs text-rose-600 font-semibold flex items-center gap-1 hover:underline"
                      >
                        <Icon name="mic" className="w-3.5 h-3.5" />
                        <span>{escuchando && campoEscuchando === 'notas' ? 'Escuchando...' : 'Dictar nota'}</span>
                      </button>
                    </div>
                    <textarea
                      rows="2"
                      value={form.notas}
                      onChange={(e) => setForm({ ...form, notas: e.target.value })}
                      placeholder="Detalles adicionales, equipo fotográfico, salón o enlaces..."
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setModalAbierto(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow"
                    >
                      Guardar Compromiso
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: ASISTENTE DE DICTADO POR VOZ INTELIGENTE */}
          {modalVozAbierto && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <Icon name="mic" className="w-5 h-5 text-rose-600" />
                    <span>Dictado Inteligente de Compromisos</span>
                  </h3>
                  <button onClick={() => setModalVozAbierto(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex flex-col items-center justify-center py-4 space-y-3 bg-slate-50 rounded-2xl border border-slate-200">
                  <button
                    type="button"
                    onClick={() => iniciarDictado('asistente')}
                    className={`w-16 h-16 rounded-full flex items-center justify-center transition shadow-lg ${
                      escuchando
                        ? 'bg-rose-600 text-white mic-pulse'
                        : 'bg-slate-900 hover:bg-indigo-600 text-white'
                    }`}
                  >
                    <Icon name="mic" className="w-7 h-7" />
                  </button>
                  <p className="text-xs font-semibold text-slate-700">
                    {escuchando ? 'Escuchando en Español (es-MX)... Habla ahora' : 'Toca el micrófono y dicta tu compromiso'}
                  </p>
                  {textoDictado && (
                    <p className="text-xs text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-200 max-w-md text-center">
                      "{textoDictado}"
                    </p>
                  )}
                  {errorVoz && (
                    <p className="text-xs text-rose-700 bg-rose-50 px-3 py-2 rounded-lg border border-rose-200 text-center">
                      {errorVoz}
                    </p>
                  )}
                </div>

                {/* Vista previa editable de lo detectado */}
                <div className="space-y-2.5 text-xs bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                  <div className="font-bold text-slate-700 uppercase">Vista Previa Detectada (Editable):</div>
                  <input
                    type="text"
                    value={form.titulo}
                    onChange={(e) => setForm({ ...form, titulo: e.target.value })}
                    placeholder="O escribe aquí tu frase y se clasificará sola..."
                    onBlur={(e) => {
                      if (e.target.value.trim()) setForm(interpretarFraseNatural(e.target.value));
                    }}
                    className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white font-medium"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <span className="text-slate-500 block">Ámbito detectado:</span>
                      <span className="font-bold text-slate-900">{AMBITOS[form.ambito]?.nombre}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block">Subcategoría:</span>
                      <span className="font-bold text-slate-900">{form.subcategoria}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block">Fecha:</span>
                      <span className="font-bold text-slate-900">{form.fecha}</span>
                    </div>
                    <div>
                      <span className="text-slate-500 block">Horario:</span>
                      <span className="font-bold text-slate-900">{form.horaInicio} - {form.horaFin}</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setModalVozAbierto(false)}
                    className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700"
                  >
                    Cancelar
                  </button>
                  <button
                    type="button"
                    onClick={guardarCompromiso}
                    className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow"
                  >
                    Confirmar y Agendar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: CONFIGURACIÓN NUBE (FIREBASE) Y RESPALDOS JSON */}
          {modalNubeAbierto && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-base text-slate-900">Sincronización Multi-Dispositivo y Respaldos</h3>
                  <button onClick={() => setModalNubeAbierto(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-bold uppercase text-slate-600">
                    1. Respaldo rápido en archivo (Sin configurar servidores)
                  </label>
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={exportarRespaldoJSON}
                      className="px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      <span>Descargar Respaldo (.json)</span>
                    </button>
                    <label className="px-3.5 py-2 rounded-xl border border-slate-300 text-slate-700 text-xs font-semibold cursor-pointer hover:bg-slate-50 flex items-center gap-1.5">
                      <Icon name="upload" className="w-4 h-4" />
                      <span>Cargar Respaldo (.json)</span>
                      <input type="file" accept=".json" onChange={importarRespaldoJSON} className="hidden" />
                    </label>
                  </div>
                </div>

                <div className="space-y-2 pt-2 border-t border-slate-200">
                  <label className="block text-xs font-bold uppercase text-slate-600">
                    2. Sincronización en tiempo real con Firebase (Opcional)
                  </label>
                  <p className="text-xs text-slate-500">
                    Pega aquí tu bloque <code>firebaseConfig</code> de tu consola de Firebase para sincronizar automáticamente entre tu iPad, celular y PC:
                  </p>
                  <textarea
                    rows="4"
                    value={firebaseConfigStr}
                    onChange={(e) => setFirebaseConfigStr(e.target.value)}
                    placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "..."}'
                    className="w-full p-2.5 rounded-xl border border-slate-300 text-xs font-mono"
                  />
                  {mensajeNube && (
                    <p className="text-xs font-medium text-emerald-700 bg-emerald-50 p-2 rounded-lg">{mensajeNube}</p>
                  )}
                  <div className="flex justify-end gap-2">
                    <button
                      onClick={() => {
                        localStorage.setItem('agenda_javier_fb_config', firebaseConfigStr);
                        setModalNubeAbierto(false);
                      }}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                    >
                      Guardar Configuración
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
